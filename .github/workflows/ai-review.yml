name: AI PR Review & Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          # Get added/modified files in PR
          FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run Hugo/Markdown review checks
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          PR_NUMBER: ${{ steps.diff.outputs.pr_number }}
        run: |
          set -euo pipefail
          ISSUES=""
          FIXES_APPLIED=0
          REVIEW_BODY="## 🤖 Automated PR Review\n\n"

          # Categorize changed files
          MD_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(md|markdown)$' || true)
          HTML_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(html|htm)$' || true)
          CONFIG_FILES=$(echo "$CHANGED_FILES" | grep -E '(hugo\.toml|hugo\.yaml|config\.toml|config\.yaml)' || true)

          # --- Check 1: Frontmatter validation for markdown posts ---
          if [ -n "$MD_FILES" ]; then
            REVIEW_BODY="${REVIEW_BODY}### 📝 Markdown/Frontmatter Checks\n\n"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [[ "$file" == content/posts/* ]] || [[ "$file" == content/* ]]; then
                # Check frontmatter exists
                if ! head -1 "$file" 2>/dev/null | grep -q '^+++\|^---'; then
                  REVIEW_BODY="${REVIEW_BODY}- ⚠️ \`$file\`: Missing Hugo frontmatter (--- or +++)\n"
                  ISSUES="${ISSUES}nofm:$file\n"
                else
                  # Check required fields (title, date)
                  FM_END=$(awk '/^---$/{c++; if(c==2){exit NR}; if(c==1)next}NR==1{next}' "$file" 2>/dev/null || echo 0)
                  if [ "$FM_END" -gt 0 ]; then
                    FM_CONTENT=$(head -"$FM_END" "$file")
                    if ! echo "$FM_CONTENT" | grep -qi 'title\s*[:=]'; then
                      REVIEW_BODY="${REVIEW_BODY}- ⚠️ \`$file\`: Missing \`title\` in frontmatter\n"
                    fi
                    if ! echo "$FM_CONTENT" | grep -qi 'date\s*[:=]'; then
                      REVIEW_BODY="${REVIEW_BODY}- ⚠️ \`$file\`: Missing \`date\` in frontmatter\n"
                    fi
                  fi
                  REVIEW_BODY="${REVIEW_BODY}- ✅ \`$file\`: Frontmatter present\n"
                fi

                # Check for broken internal links
                if grep -q '\]\(/[^)]*\)' "$file" 2>/dev/null; then
                  BROKEN=$(grep -oP '\]\((/[^)]+)\)' "$file" | grep -oP '/[^)]+' | while read link; do
                    # Check if it looks like a Hugo ref/relref
                    if [[ "$link" == \{\{* ]]; then continue; fi
                    target="content${link}"
                    # Try .md or /index.md
                    if [ ! -f "$target" ] && [ ! -f "${target}.md" ] && [ ! -f "${target}/index.md" ] && [ ! -f "static${link}" ]; then
                      echo "$link"
                    fi
                  done)
                  if [ -n "$BROKEN" ]; then
                    REVIEW_BODY="${REVIEW_BODY}- ⚠️ \`$file\`: Possibly broken internal link(s): $(echo "$BROKEN" | tr '\n' ' ')\n"
                  fi
                fi
              fi
            done <<< "$MD_FILES"
          fi

          # --- Check 2: HTML structure for shortcodes ---
          if [ -n "$HTML_FILES" ]; then
            REVIEW_BODY="${REVIEW_BODY}\n### 🏗️ HTML Structure Checks\n\n"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Check for unclosed Hugo shortcodes
              if grep -q '{{<' "$file" && ! grep -q '{{</' "$file"; then
                REVIEW_BODY="${REVIEW_BODY}- ⚠️ \`$file\`: Possibly unclosed shortcode \`{{<\`\n"
              fi
              REVIEW_BODY="${REVIEW_BODY}- ✅ \`$file\`: HTML file checked\n"
            done <<< "$HTML_FILES"
          fi

          # --- Check 3: Trailing whitespace auto-fix ---
          FIXED_WS=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            if grep -qP '[ \t]+$' "$file" 2>/dev/null; then
              sed -i 's/[[:space:]]*$//' "$file"
              FIXED_WS=$((FIXED_WS+1))
            fi
          done <<< "$CHANGED_FILES"
          if [ "$FIXED_WS" -gt 0 ]; then
            REVIEW_BODY="${REVIEW_BODY}\n### 🔧 Auto-Fixes\n\n"
            REVIEW_BODY="${REVIEW_BODY}- ✅ Removed trailing whitespace in $FIXED_WS file(s)\n"
            FIXES_APPLIED=1
          fi

          # --- Check 4: Missing newline at EOF ---
          FIXED_EOF=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            if [ -s "$file" ] && [ "$(tail -c1 "$file" | wc -l)" -eq 0 ]; then
              echo "" >> "$file"
              FIXED_EOF=$((FIXED_EOF+1))
            fi
          done <<< "$CHANGED_FILES"
          if [ "$FIXED_EOF" -gt 0 ]; then
            REVIEW_BODY="${REVIEW_BODY}- ✅ Added missing newline at EOF in $FIXED_EOF file(s)\n"
            FIXES_APPLIED=1
          fi

          # --- Check 5: Hugo build sanity (dry check) ---
          if command -v hugo &>/dev/null; then
            if hugo --gc --minify --dryRun 2>&1 | grep -qi error; then
              REVIEW_BODY="${REVIEW_BODY}\n### ⚠️ Hugo Build Warning\n\n"
              REVIEW_BODY="${REVIEW_BODY}- Hugo dry-run detected errors. Check build output.\n"
            fi
          fi

          REVIEW_BODY="${REVIEW_BODY}\n---\n*Automated by AI PR Review*"

          # Post review comment
          PR_NUM="${{ github.event.pull_request.number }}"
          gh pr comment "$PR_NUM" --body "$(echo -e "$REVIEW_BODY")"

          # Push auto-fixes if any
          if [ "$FIXES_APPLIED" -eq 1 ]; then
            git add -A
            git commit -m "🤖 auto-fix: trailing whitespace & EOF newlines [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
            echo "fixes_pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixes_pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve PR if no critical issues
        if: steps.review.outputs.fixes_pushed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          # Only approve if we have write permission
          gh pr review "$PR_NUM" --approve --body "✅ Automated review complete. No critical issues found." 2>/dev/null || \
          echo "Skip approval (insufficient permissions)"
