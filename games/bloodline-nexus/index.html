<html lang="ko">

<title>블러드라인 넥서스 — Bloodline Nexus</title>

<style>
  :root{
    --bg:#1a0f14; --bg2:#22141b; --card:#2a1a20; --card-light:#36222b; --border:#4a2f3a;

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font); font-size:15px; line-height:1.5;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:430px; min-height:100dvh;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));

  /* ── Header ── */
  header{display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px 10px; border-bottom:2px solid var(--border)}
  header h1{font-size:19px; letter-spacing:.5px; font-weight:800; color:var(--gold)}
  header .sub{font-size:11px; color:var(--muted)}

  /* ── HUD ── */
  .hud{display:flex; gap:8px; padding:10px 0; font-size:12px; font-variant-numeric:tabular-nums}
  .hud .cell{flex:1; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 8px; text-align:center}
  .hud b{display:block; font-size:15px}
  .hud .gen b{color:var(--gold)}

  /* ── Panel ── */
  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px}
  .panel h2{font-size:15px; margin-bottom:8px; color:var(--gold)}
  .panel .dim{font-size:12px; color:var(--muted); margin-top:6px}
  .row{display:flex; gap:8px; align-items:center}
  .grow{flex:1}

  /* ── Buttons ── */
  button{
    font-family:var(--font); font-size:15px; font-weight:700; color:#201510;
    background:linear-gradient(135deg, #e8b04b, #c98a2e); border:none; border-radius:10px;
    padding:12px 16px; cursor:pointer; width:100%;

  button:active{transform:scale(.98)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:var(--card-light); color:var(--text); border:1px solid var(--border)}
  button.danger{background:linear-gradient(135deg,#d9534f,#a93226); color:#fff}

  /* ── Card grid ── */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer;
    transition:border-color .15s, background .15s;

  .card.picked{border-color:var(--gold); background:var(--card-light)}
  .card .nm{font-weight:800; font-size:13px}
  .card .fm{font-size:11px; color:var(--muted)}
  .card .st{font-size:11px; margin-top:6px; color:var(--info); font-variant-numeric:tabular-nums}
  .card .nt{font-size:11px; color:var(--gold-dim); margin-top:2px}
  .card .mine{border-style:dashed}
  .card.disabled{opacity:.4; cursor:not-allowed}

  .preview{border-radius:10px; padding:10px; margin-bottom:10px; font-size:13px; background:var(--bg2); border:1px solid var(--border)}
  .preview .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:800; margin-right:6px}
  .tag.good{background:rgba(93,178,107,.18); color:var(--good); border:1px solid var(--good)}
  .tag.bad{background:rgba(217,83,79,.18); color:var(--bad); border:1px solid var(--bad)}
  .tag.neutral{background:rgba(169,143,152,.15); color:var(--muted); border:1px solid var(--border)}

  .foal .nm{font-size:22px; font-weight:900; color:var(--gold)}
  .foal .parents{font-size:12px; color:var(--muted); margin:2px 0 10px}

  .stats .s{flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:8px 4px}
  .stats .s b{display:block; font-size:22px; color:var(--gold); font-variant-numeric:tabular-nums}
  .stats .s span{font-size:11px; color:var(--muted)}

  .badge{display:inline-block; background:linear-gradient(135deg,#c0392b,#8e2a1e); color:#ffe9c9; font-size:11px; font-weight:800; border-radius:20px; padding:3px 10px; margin-bottom:8px}
  .muted{color:var(--muted)}
  .scroll{overflow-y:auto; flex:1}
</style>

  const seed = (s) => { _seed = s | 0; return _seed; };
  const rnd = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];

  const card = (id) => SIRES.find(c => c.id === id) || DAMS.find(c => c.id === id);

  /* COI — v3 §3: COI = Σ(0.5)^(n1+n2+1) (foal 카드는 anc 없음 → COI 0) */
  function calcCOI(sire, dam) {
    let coi = 0; const commons = [];
    const sa = sire.anc || [], da = dam.anc || [];
    for (const [an, n1] of sa) {
      for (const [bn, n2] of da) {
        if (an === bn) {
          coi += Math.pow(0.5, num(n1, 2) + num(n2, 2) + 1);
          commons.push({ name: an, n1, n2 });
        }
      }
    }
    return { coi: round4(num(coi, 0)), commons };
  }
  function coiBand(coi) {
    for (const b of COI_BANDS) if (coi < b.max) return b;
    return COI_BANDS[COI_BANDS.length - 1];
  }
  function nickOf(sire, dam) {
    return (NICKS[sire.line] && NICKS[sire.line][dam.line]) || { n:'NEUTRAL', label:'중립 조합' };
  }
  function isHetero(sire, dam) { return sire.line !== dam.line; }
  function avgStat(cardA, cardB) { return (num(cardA.spd,50) + num(cardA.end,50) + num(cardA.sta,50) + num(cardB.spd,50) + num(cardB.end,50) + num(cardB.sta,50)) / 6; }

  function foalName() { return pick(NAME_A) + ' ' + pick(NAME_B); }

  /* ═══════════ 상태 ═══════════ */
  function newState() {
    return {
      phase: 'title',           // title | select | result | summary
      gen: 1,
      sireId: null, damId: null,
      horses: [],               // 세대별 자마 (완성 기록)
      last: null,               // 직전 교배 결과
      legacy: false,            // 부자 계승 각인 활성 (2세대 보너스)
      legacyNote: null,
      meta: { plays:0, bestScore:0, bestName:'—', bestLine:'', bestGen:0, legacyFrom:null },
      pending: null             // 임시
    };
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || !d.meta) return null;
      return d;
    } catch (e) { return null; }
  }
  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 저장 실패 무시 */ }
  }
  function wipeSave() {
    try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
  }

  /* ═══════════ 액션 ═══════════ */
  function startGame() {
    const prev = (state && state.meta) ? state.meta : { plays:0, bestScore:0, bestName:'—', bestLine:'', bestGen:0, legacyFrom:null };
    state = newState();
    state.meta = prev;
    state.meta.plays = num(prev.plays, 0);
    // 부자 계승 판정 — v8 1호 §3.1: 이전 세이브의 명마가 남긴 각인
    if (prev.bestScore >= 200 && prev.bestName && prev.bestName !== '—') {
      state.legacy = true;
      state.legacyNote = {
        name: prev.bestName,
        line: prev.bestLine,
        score: prev.bestScore,
        text: `${prev.bestName}의 혈통 각인 — 계승 보너스. 실제 경마사에선 딥 임팩트→콘트레일 부자 무패 3관 (v8 1호 §3.1).`
      };
    }
    state.phase = 'select';
    state.gen = 1;
    render();
    return { ok:true };
  }

  function pickSire(id) {
    if (state.phase !== 'select') return { ok:false, reason:'선택 단계가 아닙니다' };
    if (!SIRES.some(c => c.id === id) && !(state.horses.length && state.horses[state.horses.length-1].gen === state.gen - 1 && id === 'foal-' + (state.gen - 1))) {
      return { ok:false, reason:'유효하지 않은 씨수마' };
    }
    state.sireId = id;
    render(); // 미리보기 갱신
    return { ok:true };
  }
  function pickDam(id) {
    if (state.phase !== 'select') return { ok:false, reason:'선택 단계가 아닙니다' };
    if (!DAMS.some(c => c.id === id)) return { ok:false, reason:'유효하지 않은 모계' };
    state.damId = id;
    render();
    return { ok:true };
  }

  function sireCard() {
    const id = state.sireId;
    if (!id) return null;
    if (id.indexOf('foal-') === 0) {
      const g = parseInt(id.slice(5), 10);
      return state.horses.find(h => h.gen === g) || null; // 직접 세대 지정 (chain 적발: horses[last]는 G2 이후 오작동)
    }
    return SIRES.find(c => c.id === id) || null;
  }

  /* 교배 — v3 §2 Nicks + §3 COI + §4 잡종 강세 통합 */
  function breed() {
    if (state.phase !== 'select') return { ok:false, reason:'선택 단계가 아닙니다' };
    if (!state.sireId || !state.damId) return { ok:false, reason:'씨수마와 모계를 모두 선택하세요' };
    const sire = sireCard();
    const dam = DAMS.find(c => c.id === state.damId);
    if (!sire || !dam) return { ok:false, reason:'카드를 찾을 수 없습니다' };

    const nick = nickOf(sire, dam);
    const { coi, commons } = calcCOI(sire, dam);
    const band = coiBand(coi);
    const hetero = isHetero(sire, dam);
    const bothStrong = avgStat(sire, dam) >= 52; // v3 §4 성공 조건 1
    const nickB = NICK_BONUS[nick.n];
    const heteroB = hetero ? HETERO_BONUS + (bothStrong ? HETERO_EXTRA : 0) : 0;

    /* 리스크 롤 — 인브리딩 고위험 (v3 §3 단점) */
    const riskHit = coi > 0 && rng() < band.risk;
    const riskPen = riskHit ? band.pen : 0;

    /* 자식 스탯 — NaN 가드 필수 (chain #4 적발 유형) */
    const st = {};
    for (const k of ['spd', 'end', 'sta']) {
      const base = (num(sire[k], 50) + num(dam[k], 50)) / 2 + rnd(-2, 2);
      let v = base + num(nickB, 0) + num(heteroB, 0) + num(band.bonus, 0) + num(riskPen, 0);
      if (state.legacy && state.gen === 1) v += LEGACY_BONUS; // 부자 계승 (v8 1호)
      st[k] = clamp(Math.round(v), 30, 90);
    }

    const foal = {
      name: foalName(),
      gen: state.gen,
      line: sire.line, lineName: sire.lineName,
      anc: [], // 자마는 조상 테이블 없음 → 교배 시 COI 0 (calcCOI 가드)
      sireName: sire.name, damName: dam.name,
      spd: st.spd, end: st.end, sta: st.sta,
      nick: nick.n, nickLabel: nick.label,
      coi, coiLv: coi > 0 ? band.lv : null, coiLabel: coi > 0 ? band.label : null,
      hetero, bothStrong,
      riskHit, riskEvent: riskHit ? RISK_EVENTS[band.lv][0] : null,
      legacyApplied: state.legacy && state.gen === 1,
      score: null
    };
    const sum = perf(foal);
    if (!Number.isFinite(sum)) { // 방어: NaN이면 중립값으로 재계산
      foal.spd = clamp(Math.round((num(sire.spd,50) + num(dam.spd,50)) / 2), 30, 90);
      foal.end = clamp(Math.round((num(sire.end,50) + num(dam.end,50)) / 2), 30, 90);
      foal.sta = clamp(Math.round((num(sire.sta,50) + num(dam.sta,50)) / 2), 30, 90);
    }

    state.last = foal;
    state.phase = 'result';
    render();
    return { ok:true, foal };
  }

  function nextGen() {
    if (state.phase !== 'result') return { ok:false, reason:'결과 단계가 아닙니다' };
    state.horses.push(state.last);
    state.gen += 1;
    state.sireId = null; state.damId = null;
    if (state.gen > 3) {
      state.phase = 'result'; // finish() 경유
      return finish();
    }
    state.phase = 'select';
    render();
    return { ok:true };
  }

  /* 최종 평가 — 균형 보너스 + 닉 시너지 (v3 §5 선택 기준 반영) */
  function evaluator(h) {
    const sum = perf(h);
    const sd = Math.sqrt((Math.pow(h.spd - sum/3, 2) + Math.pow(h.end - sum/3, 2) + Math.pow(h.sta - sum/3, 2)) / 3);
    const bal = sd <= 6 ? 12 : sd <= 10 ? 6 : 0;          // 균형 능력
    const nickB = h.nick === 'GOOD' ? 8 : 0;              // 닉 시너지 (v3 §2)
    const coiB = h.coi >= 0.10 ? 10 : h.coi > 0 ? 4 : 0;  // 인브리딩 고정 가치 (v3 §3 장점)
    return num(sum + bal + nickB + coiB, 0);
  }
  function gradeOf(sc) {
    if (sc >= 255) return 'S';
    if (sc >= 235) return 'A';
    if (sc >= 215) return 'B';
    return 'C';
  }

  function finish() {
    const h = state.last;
    const sc = evaluator(h);
    h.score = sc;
    state.phase = 'summary';
    state.meta.plays += 1;
    if (sc > state.meta.bestScore) {
      state.meta.bestScore = sc;
      state.meta.bestName = h.name;
      state.meta.bestLine = h.lineName;
      state.meta.bestGen = h.gen;
      state.meta.legacyFrom = { name: h.name, line: h.lineName, score: sc };
    }
    persist();
    render();
    return { ok:true, score:sc, grade: gradeOf(sc) };
  }

  function retry() {
    const prev = state.meta;
    state = newState();
    state.meta = prev;
    state.phase = 'select';
    state.gen = 1;
    render();
    return { ok:true };
  }

  function resetAll() {
    state = newState();
    wipeSave();
    render();
    return { ok:true };
  }

  /* ═══════════ 렌더 ═══════════ */
  const esc = (s) => String(s == null ? '' : s);

  function tagHtml(n) {
    const cls = n === 'GOOD' ? 'good' : n === 'BAD' ? 'bad' : 'neutral';
    const txt = n === 'GOOD' ? 'GOOD NICK' : n === 'BAD' ? 'BAD NICK' : 'NEUTRAL';
    return `<span class="tag ${cls}">${txt}</span>`;
  }

  function renderTitle() {
    const m = state.meta;
    const legacyBadge = state.legacy
      ? `<div class="badge">🧬 부자 계승 각인 — ${esc(state.legacyNote.name)} (딥 임팩트→콘트레일 모티프, v8 1호 §3.1)</div>`
      : (m.bestScore >= 200 && m.bestName !== '—')
        ? `<div class="badge">🧬 ${esc(m.bestName)} 혈통 각인 보유 — 다음 플레이에서 계승 보너스</div>`
        : '';
    return `
      <header>
        <h1>🩸 BLOODLINE NEXUS</h1>
        <div class="sub">블러드라인 넥서스</div>
      </header>
      <div class="hud">
        <div class="cell">플레이<b>${m.plays}</b></div>
        <div class="cell">최고 점수<b>${m.bestScore}</b></div>
        <div class="cell">명마<b>${esc(m.bestName)}</b></div>
      </div>
      <div class="scroll">
        <div class="panel">
          <h2>혈통 카드 합성 — 3세대 금탁 교배</h2>
          <p class="muted" style="font-size:13px">씨수마 × 모계를 교배해 Nicks 호환도와 COI(근친 계수)를 읽고 최강의 자마를 완성하세요. 인브리딩은 고위험·고수익 — 3세대 끝에 남는 점수로 명마의 혈통 각인이 결정됩니다.</p>
          ${legacyBadge}
          <button data-act="start">교배 시작</button>
          <button class="ghost bigbtn" data-act="wipe">기록 초기화</button>
        </div>
        <div class="panel">
          <h2>연구 원천</h2>
          ${SOURCES.map(s => `<div class="src"><b>${esc(s.path.split('/').pop())}</b><br>${esc(s.use)}</div>`).join('')}
        </div>
      </div>`;
  }

  function selectableSires() {
    const prevFoal = state.horses.length ? state.horses[state.horses.length - 1] : null;
    const cards = SIRES.map(c => c);
    return { cards, prevFoal: (prevFoal && state.gen >= 2) ? prevFoal : null };
  }

  function renderSelect() {
    const { cards, prevFoal } = selectableSires();
    const sire = sireCard();
    const dam = state.damId ? DAMS.find(c => c.id === state.damId) : null;

    let preview = '';
    if (sire && dam) {
      const nick = nickOf(sire, dam);
      const { coi, commons } = calcCOI(sire, dam);
      const band = coiBand(coi);
      const hetero = isHetero(sire, dam);
      const bothStrong = avgStat(sire, dam) >= 52;
      const coiTxt = coi > 0
        ? `COI ${coi.toFixed(4)} (${band.lv} — ${band.label}) 공통 조상 ${commons.map(c => c.name).join('·')} · 리스크 ${Math.round(band.risk*100)}%`
        : '공통 조상 없음 — 근친 없음 (COI 0)';
      const heteroTxt = hetero
        ? `잡종 강세 ${HETERO_BONUS + (bothStrong ? HETERO_EXTRA : 0)} (${bothStrong ? '양쪽 평균 이상 — 강세 가산' : '기본 강세'}) — v3 §4`
        : '동계열 조합 — 잡종 강세 없음';
      preview = `
        <div class="preview">
          <div>${tagHtml(nick.n)} <b>${esc(nick.label)}</b></div>
          <div class="kv"><b>COI:</b> ${coiTxt}</div>
          <div class="kv"><b>교배 유형:</b> ${heteroTxt}</div>
          <div class="kv"><b>예상 자마:</b> ${esc(sire.name)} × ${esc(dam.name)}의 자마 (계통 ${esc(sire.lineName)})</div>
        </div>`;
    } else {
      preview = `<div class="preview muted">씨수마 1장 + 모계 1장을 선택하면 Nicks·COI 미리보기가 표시됩니다.</div>`;
    }

    const siresHtml = cards.map(c => {
      const picked = state.sireId === c.id;
      return `<div class="card ${picked ? 'picked' : ''}" data-sire="${c.id}">
        <div class="nm">${esc(c.name)}</div>
        <div class="fm">${esc(c.from)} · ${esc(c.lineName)}</div>
        <div class="st">S ${c.spd} · E ${c.end} · ST ${c.sta}</div>
        <div class="nt">${esc(c.note)}</div>
      </div>`;
    }).join('');
    const foalHtml = prevFoal ? `<div class="card mine ${state.sireId === 'foal-'+(prevFoal.gen) ? 'picked' : ''}" data-sire="foal-${prevFoal.gen}">
      <div class="nm">⭐ ${esc(prevFoal.name)} (G${prevFoal.gen} 자마)</div>
      <div class="fm">내 혈통 · ${esc(prevFoal.lineName)}</div>
      <div class="st">S ${prevFoal.spd} · E ${prevFoal.end} · ST ${prevFoal.sta}</div>
      <div class="nt">이전 세대의 자마 — 씨수마로 승격 가능</div>
    </div>` : '';

    const damsHtml = DAMS.map(c => {
      const picked = state.damId === c.id;
      return `<div class="card ${picked ? 'picked' : ''}" data-dam="${c.id}">
        <div class="nm">${esc(c.name)}</div>
        <div class="fm">${esc(c.from)} · ${esc(c.lineName)}</div>
        <div class="st">S ${c.spd} · E ${c.end} · ST ${c.sta}</div>
        <div class="nt">${esc(c.note)}</div>
      </div>`;
    }).join('');

    return `
      <header>
        <h1>🧬 교배 — G${state.gen}/3</h1>
        <div class="sub">혈통 넥서스</div>
      </header>
      <div class="hud">
        <div class="cell gen">세대<b>G${state.gen}/3</b></div>
        <div class="cell">씨수마<b>${sire ? esc(sire.name) : '—'}</b></div>
        <div class="cell">모계<b>${dam ? esc(dam.name) : '—'}</b></div>
      </div>
      <div class="scroll">
        ${preview}
        <div class="panel">
          <h2>씨수마 (Stallion)</h2>
          <div class="grid">${foalHtml}${siresHtml}</div>
        </div>
        <div class="panel">
          <h2>모계 (Dam)</h2>
          <div class="grid">${damsHtml}</div>
        </div>
        ${state.legacy && state.gen === 1
          ? `<div class="eventbox info">🧬 <b>부자 계승 각인:</b> ${esc(state.legacyNote.text)} 자마 전 스탯 +${LEGACY_BONUS}.</div>`
          : ''}
        <button data-act="breed" ${sire && dam ? '' : 'disabled'}>교배 실행</button>
        <button class="ghost bigbtn" data-act="title">타이틀로</button>
      </div>`;
  }

  function statBar(h) {
    return `<div class="stats">
      <div class="s"><span>속도 SPD</span><b>${h.spd}</b></div>
      <div class="s"><span>지구력 END</span><b>${h.end}</b></div>
      <div class="s"><span>스태미나 STA</span><b>${h.sta}</b></div>
    </div>`;
  }

  function renderResult() {
    const h = state.last;
    const genetic = []
      .concat(h.coi > 0 ? [`COI ${h.coi.toFixed(4)} — ${esc(h.coiLabel)}`] : ['근친 없음 (COI 0)'])
      .concat(h.hetero ? ['잡종 강세 적용'] : ['동계열 — 강세 없음'])
      .concat(h.legacyApplied ? ['부자 계승 +6 적용'] : [])
      .join(' · ');
    const riskBox = h.riskHit
      ? `<div class="eventbox warn">⚠️ <b>유전 리스크 발현 (${esc(h.coiLv)}):</b> ${esc(h.riskEvent)} 스탯 일부 상실.</div>`
      : (h.coi > 0
        ? `<div class="eventbox ok">✅ 유전 리스크 없음 — ${esc(h.coiLv)} 인브리딩의 형질 고정 성공 (v3 §3 장점).</div>`
        : `<div class="eventbox info">🌐 이종 교배 — 유전자 다양성 확보 (v3 §4).</div>`);
    return `
      <header>
        <h1>🐎 탄생 — G${h.gen}/3</h1>
        <div class="sub">혈통 넥서스</div>
      </header>
      <div class="scroll">
        <div class="foal">
          <div class="nm">${esc(h.name)}</div>
          <div class="parents">${esc(h.sireName)} × ${esc(h.damName)} · ${esc(h.lineName)}</div>
          ${statBar(h)}
          <div class="preview" style="text-align:left">
            <div>${tagHtml(h.nick)} <b>${esc(h.nickLabel)}</b></div>
            <div class="kv"><b>유전 구성:</b> ${genetic}</div>
            <div class="kv"><b>성능 지수:</b> ${perf(h)}</div>
          </div>
          ${riskBox}
        </div>
        <button data-act="next">${h.gen >= 3 ? '최종 평가' : `G${h.gen + 1} 교배로`}</button>
        <button class="ghost bigbtn" data-act="redoselect">교배 재선택</button>
      </div>`;
  }

  function renderSummary() {
    const h = state.last;
    const sc = h.score;
    const g = gradeOf(sc);
    const isBest = sc >= state.meta.bestScore;
    return `
      <header>
        <h1>🏆 결산 — 혈통 완성</h1>
        <div class="sub">3세대 금탁 교배 완료</div>
      </header>
      <div class="scroll">
        <div class="panel">
          <div class="foal">
            <div class="nm">${esc(h.name)}</div>
            <div class="parents">${esc(h.sireName)} × ${esc(h.damName)} · G${h.gen}</div>
            ${statBar(h)}
            <div class="grade ${g.toLowerCase()}">${g} 등급</div>
            <div class="scoreline">최종 점수 <b style="color:var(--gold)">${sc}</b> ${isBest ? '· 🏅 신기록' : `· 최고 ${state.meta.bestScore}`}</div>
            <div class="preview" style="text-align:left">
              <div>${tagHtml(h.nick)} <b>${esc(h.nickLabel)}</b></div>
              <div class="kv"><b>유전 구성:</b> COI ${h.coi.toFixed(4)}${h.coi > 0 ? ' (' + esc(h.coiLv) + ')' : ' (무근친)'} · ${h.hetero ? '잡종 강세' : '동계열'}${h.riskHit ? ' · 리스크 발현' : ''}</div>
              <div class="kv"><b>평가 산식:</b> 성능 지수 ${perf(h)} + 균형 보너스 + 닉 시너지 + COI 고정 가치 (v3 §2·§3·§5)</div>
            </div>
          </div>
          <button data-act="legacy">🧬 계승 시작 (부자 각인 등록)</button>
          <button class="ghost bigbtn" data-act="retry">새 혈통 시작</button>
          <button class="danger bigbtn" data-act="wipe">기록 초기화</button>
        </div>
        <div class="panel">
          <h2>명마 기록</h2>
          <div class="hist">
            <div class="hrow"><span>플레이</span><b>${state.meta.plays}</b></div>
            <div class="hrow"><span>최고 점수</span><b>${state.meta.bestScore}</b></div>
            <div class="hrow"><span>명마</span><b>${esc(state.meta.bestName)}</b></div>
          </div>
          <p class="dim">딥 임팩트 → 콘트레일처럼, 기록된 혈통이 다음 플레이에 각인으로 남습니다 (v8 1호 §3.1).</p>
        </div>
      </div>`;
  }

  function render() {
    const app = $('app');
    let html;
    if (state.phase === 'title') html = renderTitle();
    else if (state.phase === 'select') html = renderSelect();
    else if (state.phase === 'result') html = renderResult();
    else if (state.phase === 'summary') html = renderSummary();
    else html = renderTitle();
    app.innerHTML = html;
  }

  /* ═══════════ 이벤트 위임 (터치 지원) ═══════════ */
  function onAppClick(e) {
    const t = e.target;
    const actEl = t.closest ? t.closest('[data-act]') : null;
    if (actEl) {
      const act = actEl.getAttribute('data-act');
      if (act === 'start') startGame();
      else if (act === 'wipe') { if (window.confirm('혈통 기록을 초기화할까요?')) resetAll(); }
      else if (act === 'title') { state.phase = 'title'; render(); }
      else if (act === 'breed') breed();
      else if (act === 'next') nextGen();
      else if (act === 'redoselect') { state.phase = 'select'; render(); }
      else if (act === 'retry') retry();
      else if (act === 'legacy') { state.phase = 'title'; render(); persist(); }
      return;
    }
    const sireEl = t.closest ? t.closest('[data-sire]') : null;
    if (sireEl) { pickSire(sireEl.getAttribute('data-sire')); return; }
    const damEl = t.closest ? t.closest('[data-dam]') : null;
    if (damEl) { pickDam(damEl.getAttribute('data-dam')); }
  }

  /* ═══════════ 부트스트랩 (chain #3 교훈: 로드 즉시 초기 상태 + 렌더) ═══════════ */
  let state = newState();
  const saved = loadSave();
  if (saved) state = saved;
  seed(20260916);
  render();

  /* 앱 컨테이너 이벤트 연결 */
  const appEl = $('app');
  appEl.addEventListener('click', onAppClick);
  appEl.addEventListener('touchstart', () => {}, { passive:true });

  return {
    LS_KEY, SOURCES, SIRES, DAMS, NICKS, NICK_BONUS, COI_BANDS,
    HETERO_BONUS, HETERO_EXTRA, LEGACY_BONUS,
    _calc: { calcCOI, coiBand, nickOf, isHetero, avgStat, evaluator, gradeOf, perf, COI_BANDS },
    newState, startGame, pickSire, pickDam, breed, nextGen, finish, retry, resetAll,
    getState: () => state, render, seed, card
  };
})();
</script>
</body>
</html>
