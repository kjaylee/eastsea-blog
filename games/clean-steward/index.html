<!--
  CLEAN STEWARD — 클린 스튜어드
  경마 연구 → 게임 브릿지 chain #2 (GAME_CONNECTION.md 매핑 7행 확장)

  연구 원천 (활용 증거):
  1. research/horse-racing/v7/2013-godolphin-doping-scandal.md (BHA 원문 대조본, 2026-08-31)
     - 무작위·시즌 외(out-of-competition) 검사 → "샘플 채취" 이벤트 덱
     - 근육주사 스테로이드(ethylestranol/stanozolol) → "회색 처방" 유혹 카드
     - 검거 시 6개월 출전 정지(22두 전례) → 6주 출전 정지 상태
     - 2차 적발 시 8년 자격 정지(2013-04-25 알 자루니 판결) → 배드 엔딩
  2. research/horse-racing/equine-science/injuries-diseases.md
     - 심복사건(SDFT) 건염: 스프린트 부상 80%·재발률 50%+ → 재발 위험 있는 부상 이벤트
     - EIPH 폐출혈(발생률 75%+)·프론세이드 → 관할권 경계선 약물 선택지
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클린 스튜어드 — Clean Steward</title>
<style>
  :root{
    --paper:#f4efe4; --ink:#20242b; --slate:#3d4654; --steel:#6b7686;
    --copper:#b0763a; --gold:#c9a24b; --alert:#c0392b; --safe:#2e7d5b;
    --card:#fdfaf2; --line:#d8d0bd;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
    display:flex; justify-content:center; font-size:15px; line-height:1.5;
  }
  #app{width:100%; max-width:430px; min-height:100dvh; padding:14px 14px env(safe-area-inset-bottom); display:flex; flex-direction:column}
  header{display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px 10px; border-bottom:2px solid var(--ink)}
  header h1{font-size:19px; letter-spacing:.5px}
  header .sub{font-size:11px; color:var(--steel)}
  .hud{display:flex; gap:8px; padding:10px 0; font-size:12px; font-variant-numeric:tabular-nums}
  .hud .cell{flex:1; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; text-align:center}
  .hud b{display:block; font-size:15px}
  .hud .heat b{color:var(--alert)} .hud .rep b{color:var(--safe)}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .panel h2{font-size:15px; margin-bottom:6px}
  .tag{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:20px; border:1px solid currentColor; margin-left:6px; vertical-align:1px}
  .tag.race{color:var(--copper)} .tag.test{color:var(--alert)} .tag.med{color:var(--slate)} .tag.press{color:var(--steel)} .tag.rest{color:var(--safe)}
  .note{font-size:11.5px; color:var(--steel); border-left:3px solid var(--gold); padding:4px 8px; margin:8px 0; background:rgba(201,162,75,.07)}
  .horses{display:flex; gap:8px; margin:10px 0}
  .horse{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:8px 6px; text-align:center; background:#fff; cursor:pointer; user-select:none}
  .horse.sel{border-color:var(--copper); box-shadow:0 0 0 2px rgba(176,118,58,.25)}
  .horse.dis{opacity:.42; cursor:not-allowed}
  .horse b{font-size:13.5px; display:block}
  .horse small{font-size:10px; color:var(--steel); display:block}
  .bar{height:5px; background:#e7e1d2; border-radius:4px; overflow:hidden; margin-top:5px}
  .bar i{display:block; height:100%; background:var(--copper)}
  .horse .st{font-size:9.5px; margin-top:3px; display:block}
  .st.inj{color:var(--alert)} .st.sus{color:#7b1fa2}
  .choices{display:flex; flex-direction:column; gap:8px; margin-top:8px}
  .btn{border:1.5px solid var(--ink); background:#fff; border-radius:10px; padding:11px 12px; text-align:left; font-size:14px; cursor:pointer; font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn .d{font-size:11px; color:var(--steel); display:block; margin-top:1px}
  .btn.gray{border-color:var(--alert); border-style:dashed}
  .btn.gold{background:linear-gradient(90deg,rgba(201,162,75,.18),#fff)}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .log{font-size:11.5px; color:var(--slate); max-height:120px; overflow-y:auto; border-top:1px dashed var(--line); padding-top:8px}
  .log div{padding:1.5px 0}
  .verdict{font-size:16px; font-weight:700; padding:10px 0 4px}
  .verdict.bad{color:var(--alert)} .verdict.good{color:var(--safe)}
  .score-line{font-size:13px; display:flex; justify-content:space-between; padding:3px 0; font-variant-numeric:tabular-nums}
  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); background:var(--ink); color:var(--paper); font-size:13px; padding:9px 16px; border-radius:24px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; max-width:88vw; text-align:center}
  #toast.show{opacity:.96}
  .title-wrap{text-align:center; padding:36px 0 20px}
  .title-wrap .em{font-size:44px}
  .title-wrap h2{font-size:24px; margin:10px 0 4px; letter-spacing:1px}
  .title-wrap p{font-size:12.5px; color:var(--steel)}
  .best{font-size:12px; color:var(--steel); text-align:center; padding:8px 0 2px; font-variant-numeric:tabular-nums}
  .cite{font-size:10px; color:var(--steel); text-align:center; padding-top:14px; line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ RNG (seeded) ============ */
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ============ 연구 근거 상수 ============ */
/* v7/2013-godolphin-doping-scandal.md — 검거 구조: 무작위 채취, heat 비례 적발, 6주(≈6개월 축소) 정지, 2차 적발 8년 배드엔딩 */
const RULES = {
  WEEKS: 12, SUSPEND_WEEKS: 6, BAN_STRIKES: 2,
  STEROID_FIT: 22, STEROID_HEAT: 2,
  HEAT_DECAY: 0.5, CATCH_BASE: 0.15, CATCH_SLOPE: 0.09, CATCH_CAP: 0.85,
  CLEAN_TEST_REP: 4, CAUGHT_REP: -25,
  SDFT_WEEKS: 3, SDFT_FAST_WEEKS: 1, SDFT_RECUR: 0.5, /* equine-science: SDFT 재발률 50%+ */
  FURO_HEAT: 1, EIPH_MISS_FIT: -8,
};
/* equine-science/injuries-diseases.md — 스프린트 부상 80%가 SDFT 계열 */
const HORSES = [
  {id:0,name:"섬광",  style:"스프린터", fit:66, inj:0, sus:0, recur:0},
  {id:1,name:"조율",  style:"마일형",  fit:58, inj:0, sus:0, recur:0},
  {id:2,name:"만리",  style:"스테이어",fit:62, inj:0, sus:0, recur:0},
];
const SOURCES = [
  "v7/2013-godolphin-doping-scandal.md",
  "equine-science/injuries-diseases.md",
];

/* ============ 상태 ============ */
let S = null;
function newState(seed){
  return {
    seed, week:1, rep:70, heat:0, strikes:0, wins:0, runs:0, everDoped:false,
    horses: HORSES.map(h=>({...h})), log:[], phase:"play", ending:null,
  };
}

/* ============ 주간 이벤트 덱 ============ */
/* 무작위·시즌 외 검사 확산(v7 §3.2)을 검사 25% 가중치로 반영 */
const DECK = [
  {t:"race", w:35}, {t:"test", w:25}, {t:"injury", w:15},
  {t:"press", w:15}, {t:"rest", w:10},
];
function drawWeekType(rng){
  const total = DECK.reduce((s,d)=>s+d.w,0);
  let r = rng()*total;
  for(const d of DECK){ if((r-=d.w) < 0) return d.t; }
  return "rest";
}

/* ============ 순수 로직 (QA 대상) ============ */
function applyPrep(st, horseId, prep, rng){
  const h = st.horses[horseId];
  const out = {ok:false, msg:""};
  if(h.inj>0 || h.sus>0){ out.msg="출전 불가 마필"; return out; }
  if(prep==="work"){ h.fit = Math.min(100, h.fit+10); out.msg="정상 조교로 컨디션 +10"; }
  else if(prep==="rest"){ h.fit = Math.max(10, h.fit-5); out.msg="휴식 — 컨디션 -5"; }
  else if(prep==="steroid"){
    h.fit = Math.min(100, h.fit + RULES.STEROID_FIT);
    st.heat = Math.min(10, st.heat + RULES.STEROID_HEAT);
    st.everDoped = true;
    out.msg="회색 처방(스테로이드) — 컨디션 급상승, 검사 노출 상승";
  } else { out.msg="알 수 없는 조치"; return out; }
  out.ok = true; return out;
}
function catchProb(heat){
  if(heat <= 0) return 0;
  return Math.min(RULES.CATCH_CAP, RULES.CATCH_BASE + heat*RULES.CATCH_SLOPE);
}
function runSpotTest(st, rng){
  const p = catchProb(st.heat);
  const r = rng();
  if(st.heat<=0 || r>=p){
    st.rep = Math.min(100, st.rep + RULES.CLEAN_TEST_REP);
    return {caught:false, msg:"음성 판정 — 클린 기록이 평판 +4"};
  }
  const cand = st.horses.filter(h=>h.sus===0);
  const hit = cand[Math.floor(rng()*cand.length)] || st.horses[0];
  hit.sus = RULES.SUSPEND_WEEKS;
  st.rep = Math.max(0, st.rep + RULES.CAUGHT_REP);
  st.strikes += 1;
  if(st.strikes >= RULES.BAN_STRIKES){
    st.phase = "over"; st.ending = "ban";
    return {caught:true, ban:true, msg:"양성 판정 — 2차 적발. 8년 자격 정지(2013 알 자루니 판결 준거)"};
  }
  return {caught:true, ban:false, msg:`양성 판정 — ${hit.name} 6주 출전 정지·평판 -25 (22두 정지 전례)`};
}
function applyInjury(st, horseId, fast, rng){
  const h = st.horses[horseId];
  if(fast){
    h.inj = RULES.SDFT_FAST_WEEKS; st.heat = Math.min(10, st.heat + RULES.STEROID_HEAT);
    st.everDoped = true; h.recur = Math.min(1, h.recur + RULES.SDFT_RECUR);
    return {msg:"스테로이드 가속 재활 — 복귀는 빠르지만 노출·재발률 상승"};
  }
  h.inj = RULES.SDFT_WEEKS;
  return {msg:"표준 재활 프로토콜(RICE·보존 치료) — 3주 아웃"};
}
function rollInjury(st, horseId, rng){
  const h = st.horses[horseId];
  const base = 0.06 + (h.fit>85 ? 0.10 : 0) + h.recur*0.5; /* 과조교·재발 이력 반영 */
  if(rng() < base){
    h.inj = RULES.SDFT_WEEKS; h.recur = Math.min(1, h.recur + RULES.SDFT_RECUR);
    return true;
  }
  return false;
}
function runRace(st, horseId, rng){
  const h = st.horses[horseId];
  st.runs += 1;
  const mine = h.fit + rng()*15;
  const foes = [0,1,2].map(()=>60 + rng()*20);
  const rank = 1 + foes.filter(f=>f>mine).length;
  const hurt = rollInjury(st, horseId, rng);
  if(rank===1){ st.wins += 1; st.rep = Math.min(100, st.rep+3); }
  return {rank, hurt, mine:Math.round(mine)};
}
function tickWeek(st){
  st.week += 1;
  st.heat = Math.max(0, +(st.heat - RULES.HEAT_DECAY).toFixed(2));
  st.horses.forEach(h=>{
    if(h.inj>0) h.inj -= 1;
    if(h.sus>0) h.sus -= 1;
  });
}
function seasonScore(st){
  const fitSum = st.horses.reduce((s,h)=>s+h.fit,0);
  const cleanBonus = (!st.everDoped && st.strikes===0) ? 300 : 0;
  return { total: st.wins*100 + st.rep*4 + cleanBonus + Math.floor(fitSum/10), cleanBonus };
}
function endSeason(st){
  st.phase = "over";
  const sc = seasonScore(st);
  st.ending = st.strikes>0 ? "scandal" : (!st.everDoped ? "clean" : "grey");
  return sc;
}

/* ============ 저장 ============ */
const KEY = "clean-steward-v1";
function saveBest(total, rep){
  try{
    const prev = JSON.parse(localStorage.getItem(KEY) || "null") || {score:0, rep:0, wins:0, clean:0};
    localStorage.setItem(KEY, JSON.stringify({
      score: Math.max(prev.score, total),
      rep: Math.max(prev.rep, rep),
      wins: Math.max(prev.wins, S.wins),
      clean: prev.clean + ((S.ending==="clean")?1:0),
    }));
  }catch(e){}
}
function loadBest(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "null") || {score:0, rep:0, wins:0, clean:0}; }
  catch(e){ return {score:0, rep:0, wins:0, clean:0}; }
}

/* ============ UI ============ */
const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
let toastTimer = 0, toastDeadline = 0;
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add("show");
  toastDeadline = Date.now() + (ms||1800);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove("show"), ms||1800);
}
/* 재생 제어 훅(QA): 경과 시간만큼 토스트를 즉시 소진 */
window.advanceTime = function(ms){
  const now = Date.now() + ms;
  if(now >= toastDeadline){ toastEl.classList.remove("show"); }
  else { toastDeadline = now; clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), toastDeadline-Date.now()); }
};

let V = {screen:"title", weekType:null, sel:null, pendingRace:null, choiceCtx:null};

function fmtHeat(h){ return h % 1 === 0 ? String(h) : h.toFixed(1); }
function hudHTML(){
  return `<div class="hud">
    <div class="cell">주차<b>${S.week}/${RULES.WEEKS}</b></div>
    <div class="cell heat">검사 노출<b>${fmtHeat(S.heat)}</b></div>
    <div class="cell rep">평판<b>${S.rep}</b></div>
    <div class="cell">승/주행<b>${S.wins}/${S.runs}</b></div>
  </div>`;
}
function horsesHTML(selectable){
  return `<div class="horses">` + S.horses.map(h=>{
    const dis = h.inj>0 || h.sus>0;
    const cls = ["horse", (V.sel===h.id && !dis) ? "sel":"", dis?"dis":""].join(" ");
    const st = h.sus>0 ? `<span class="st sus">출전 정지 ${h.sus}주</span>`
            : h.inj>0 ? `<span class="st inj">재활 ${h.inj}주</span>` : "";
    return `<div class="${cls}" data-h="${h.id}">
      <b>${h.name}</b><small>${h.style}</small>
      <div class="bar"><i style="width:${h.fit}%"></i></div>
      <span class="st">${h.fit}</span>${st}
    </div>`;
  }).join("") + `</div>`;
}
const TAGS = {race:["레이스","race"], test:["샘플 채취","test"], injury:["구름 진단","med"], press:["언론·스폰서","press"], rest:["조정 주","rest"]};
function evTitle(t){ const [n,c]=TAGS[t]; return `<h2>제 ${S.week}주 — ${n}<span class="tag ${c}">${t==="test"?"out-of-competition":"weekly"}</span></h2>`; }

const NOTE_RACE = `연구 근거 — v4 체형·컨디션 문서: 조교는 컨디션을 올리지만 과조교(컨디션 85+)는 부상 위험을 높인다.`;
const NOTE_TEST = `연구 근거 — 2013 고돌핀 사건: BHA 무작위·시즌 외 채취(4/9)가 회색지대 투약을 적발했다. 노출이 쌓일수록 적발 확률이 오른다(15%+노출×9%, 상한 85%).`;
const NOTE_INJ  = `연구 근거 — equine-science: 심복사건(SDFT) 건염은 스프린트 부상의 80%, 재발률 50%+. 표준 재활은 느리지만 확실하다.`;
const NOTE_PRESS= `연구 근거 — v7 §3: 스캔들 이후 대형 마방은 거버넌스를 재편했다. 평판은 스폰서 유치의 자산이다.`;
const NOTE_REST = `연구 근거 — v2 워크아웃 문서: 회복 주는 장기 컨디션의 토대다. 노출 수치도 자연 감쇠(-0.5/주)한다.`;

function render(){
  if(V.screen==="title"){
    const b = loadBest();
    app.innerHTML = `
      <div class="title-wrap">
        <div class="em">🐎</div>
        <h2>클린 스튜어드</h2>
        <p>CLEAN STEWARD — 마방 감독 시뮬레이션 · 12주 시즌</p>
        <p style="margin-top:10px">성적 유혹과 검사 노출 사이,<br>당신의 마방은 클린한가</p>
      </div>
      <div class="choices">
        <button class="btn gold" data-act="start"><b>시즌 시작</b><span class="d">말 3두 · 평판 70 · 노출 0에서 출발</span></button>
      </div>
      <div class="best">BEST ${b.score} · 최고평판 ${b.rep} · 최다승 ${b.wins} · 클린 시즌 ${b.clean}회</div>
      <div class="cite">연구 브릿지 chain #2 — GAME_CONNECTION.md 매핑 7행<br>${SOURCES.join(" · ")}</div>`;
    return;
  }
  if(V.screen==="over"){
    const sc = seasonScore(S);
    const titles = {
      ban:"8년 자격 정지", scandal:"스캔들 시즌", grey:"회색지대 시즌", clean:"클린 스튜어드",
    };
    const cls = (S.ending==="clean") ? "good" : "bad";
    app.innerHTML = `
      <div class="panel">
        <div class="verdict ${cls}">${titles[S.ending]}</div>
        <div class="score-line"><span>승/주행</span><b>${S.wins}승 / ${S.runs}주행</b></div>
        <div class="score-line"><span>최종 평판</span><b>${S.rep}</b></div>
        <div class="score-line"><span>클린 보너스</span><b>${sc.cleanBonus ? "+300 (시즌 무투약)" : 0}</b></div>
        <div class="score-line" style="border-top:1px solid var(--line);margin-top:4px;padding-top:7px"><span><b>총점</b></span><b>${sc.total}</b></div>
        <div class="note">${S.ending==="clean" ? "유혹을 전부 거절한 시즌 — 규제가 바뀌어도 흔들리지 않는 마방." : S.ending==="ban" ? "2차 적발. 2013년 알 자루니 판결처럼 자격은 8년 정지된다." : "성적은 냈지만 그림자가 남는 시즌이었다."}</div>
      </div>
      <div class="choices"><button class="btn gold" data-act="restart"><b>새 시즌</b><span class="d">랜덤 시드로 재개</span></button></div>
      <div class="log">${S.log.slice(-8).map(l=>`<div>${l}</div>`).join("")}</div>`;
    return;
  }
  /* play */
  let body = "";
  if(V.weekType==="race"){
    body = `<div class="panel">${evTitle("race")}
      <div class="note">${NOTE_RACE}</div>
      ${horsesHTML(true)}
      <div class="choices" id="preps">
        <button class="btn" data-prep="work"><b>정상 조교 후 출전</b><span class="d">컨디션 +10 · 과조교 시 부상 위험</span></button>
        <button class="btn" data-prep="rest"><b>가벼운 조정 후 출전</b><span class="d">컨디션 -5 · 안전</span></button>
        <button class="btn gray" data-prep="steroid"><b>회색 처방 — 근육주사 스테로이드</b><span class="d">컨디션 +22 · 노출 +2 · 적발 시 6주 정지 (ethylestranol/stanozolol)</span></button>
      </div></div>`;
  } else if(V.weekType==="test"){
    const res = runSpotTest(S, rngRef);
    S.log.push(`W${S.week} 샘플 채취 — ${res.msg}`);
    body = `<div class="panel">${evTitle("test")}
      <div class="note">${NOTE_TEST}</div>
      <div class="verdict ${res.caught?"bad":"good"}">${res.caught?"🔴 양성 판정":"🟢 음성 판정"}</div>
      <p style="font-size:13px">${res.msg}</p></div>
      <div class="choices"><button class="btn" data-act="next"><b>다음 주 →</b></button></div>`;
    toast(res.msg, 2600);
  } else if(V.weekType==="injury"){
    body = `<div class="panel">${evTitle("injury")}
      <div class="note">${NOTE_INJ}</div>
      ${horsesHTML(true)}
      <div class="choices">
        <button class="btn" data-inj="0"><b>표준 재활 (RICE·보존 치료)</b><span class="d">3주 아웃 · 노출 0 · 재발 위험 낮음</span></button>
        <button class="btn gray" data-inj="1"><b>스테로이드 가속 재활</b><span class="d">1주 아웃 · 노출 +2 · 재발률 급증</span></button>
      </div></div>`;
  } else if(V.weekType==="press"){
    let msg;
    if(S.rep>=75){ S.rep=Math.min(100,S.rep+5); msg="클린 브랜드 평가 — 스폰서 계약 연장. 평판 +5"; }
    else if(S.heat>=4){ S.rep=Math.max(0,S.rep-8); msg="가십란 점점 — \"그 마방, 뭔가 있다\". 평판 -8"; }
    else { S.rep=Math.min(100,S.rep+2); msg="조용한 한 주. 평판 +2"; }
    S.log.push(`W${S.week} 언론 — ${msg}`);
    body = `<div class="panel">${evTitle("press")}
      <div class="note">${NOTE_PRESS}</div>
      <p style="font-size:13px">${msg}</p></div>
      <div class="choices"><button class="btn" data-act="next"><b>다음 주 →</b></button></div>`;
    toast(msg);
  } else {
    S.horses.forEach(h=>{ if(h.inj===0&&h.sus===0) h.fit=Math.min(100,h.fit+4); });
    S.log.push(`W${S.week} 조정 주 — 전 마필 컨디션 +4`);
    body = `<div class="panel">${evTitle("rest")}
      <div class="note">${NOTE_REST}</div>
      <p style="font-size:13px">수의 관찰·주마 관리·노출 감쇠. 전 마필 컨디션 +4.</p></div>
      <div class="choices"><button class="btn" data-act="next"><b>다음 주 →</b></button></div>`;
  }
  app.innerHTML = hudHTML() + body +
    `<div class="log">${S.log.slice(-6).map(l=>`<div>${l}</div>`).join("")}</div>`;
}

/* ============ 입력 ============ */
app.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-h],[data-prep],[data-inj],[data-act]");
  if(!t) return;
  if(t.dataset.h !== undefined){
    const h = S.horses[+t.dataset.h];
    if(h.inj>0||h.sus>0){ toast(`${h.name}은(는) 출전 불가 상태입니다`); return; }
    V.sel = +t.dataset.h; render(); return;
  }
  if(t.dataset.prep){
    if(V.sel===null){ toast("출전 마필을 먼저 선택하세요"); return; }
    const res = applyPrep(S, V.sel, t.dataset.prep, rngRef);
    if(!res.ok){ toast(res.msg); return; }
    const r = runRace(S, V.sel, rngRef);
    S.log.push(`W${S.week} 레이스 — ${res.msg} / ${S.horses[V.sel].name} ${r.rank}위${r.hurt?" · SDFT 부상!":""}`);
    let extra = "";
    if(t.dataset.prep==="steroid") extra = `<div class="note">연구 근거 — v7: 검출 전까지 누구도 모른다. 노출 ${fmtHeat(S.heat)}.</div>`;
    app.innerHTML = hudHTML() + `<div class="panel">
      <div class="verdict ${r.rank===1?"good":(r.rank>=3?"bad":"")}">${r.rank===1?"🏆 우승!":r.rank+"위"}</div>
      <p style="font-size:13px">${res.msg}<br>레이스 지수 ${r.mine}${r.hurt?` · <span style="color:var(--alert)">심복사건 건염 의심 — 3주 재활</span>`:""}</p>
      ${extra}</div>
      <div class="choices"><button class="btn" data-act="next"><b>다음 주 →</b></button></div>
      <div class="log">${S.log.slice(-6).map(l=>`<div>${l}</div>`).join("")}</div>`;
    toast(r.rank===1 ? "우승 — 평판 +3" : `${r.rank}위`);
    V.pendingRace = true; return;
  }
  if(t.dataset.inj){
    if(V.sel===null){ toast("대상 마필을 먼저 선택하세요"); return; }
    const res = applyInjury(S, V.sel, t.dataset.inj==="1", rngRef);
    S.log.push(`W${S.week} 구름 진단 — ${res.msg}`);
    app.innerHTML = hudHTML() + `<div class="panel">
      <div class="verdict">치료 계획 확정</div>
      <p style="font-size:13px">${res.msg}</p>
      <div class="note">${t.dataset.inj==="1"?"연구 근거 — 표준 재활을 건너뛰면 재발률 50%+가 따라온다.":"연구 근거 — 느리지만 확실한 길. 노출 0."}</p></div>
      <div class="choices"><button class="btn" data-act="next"><b>다음 주 →</b></button></div>
      <div class="log">${S.log.slice(-6).map(l=>`<div>${l}</div>`).join("")}</div>`;
    V.pendingRace = true; return;
  }
  const a = t.dataset.act;
  if(a==="start"||a==="restart"){
    const seed = (Date.now()^(Math.random()*1e9))>>>0;
    startSeason(seed); return;
  }
  if(a==="next"){
    if(S.phase==="over"){ V.screen="over"; render(); return; }
    tickWeek(S);
    if(S.week > RULES.WEEKS){ const sc=endSeason(S); saveBest(sc.total, S.rep); V.screen="over"; render(); return; }
    beginWeek(); return;
  }
});

/* ============ 시즌 흐름 ============ */
let rngRef = ()=>Math.random();
function startSeason(seed){
  S = newState(seed);
  rngRef = mulberry32(seed);
  V = {screen:"play", weekType:null, sel:null, pendingRace:null, choiceCtx:null};
  beginWeek();
}
function beginWeek(){
  V.weekType = drawWeekType(rngRef);
  V.sel = null;
  if(V.weekType==="race"||V.weekType==="injury"){
    const ok = S.horses.some(h=>h.inj===0&&h.sus===0);
    if(!ok) V.weekType = "rest";
  }
  render();
}

/* ============ 텍스트 건전성(QA) ============ */
function render_game_to_text(){ return document.body.innerText || ""; }

/* ============ QA 자동화 (?qa=1) ============ */
(function(){
  const params = new URLSearchParams(location.search);
  if(!params.get("qa")) return;
  const pageErrors = [];
  window.addEventListener("error", ev=>pageErrors.push(String(ev.message)));
  const A = []; let pass = true;
  function assert(name, cond){
    A.push({name, ok:!!cond});
    if(!cond) pass = false;
  }
  function cloneState(st){ return JSON.parse(JSON.stringify(st)); }

  // 1. 시드 결정론: 같은 시드 → 같은 주 덱 시퀀스
  (function(){
    const r1 = mulberry32(42), r2 = mulberry32(42);
    const s1 = Array.from({length:12},()=>drawWeekType(r1)).join(",");
    const s2 = Array.from({length:12},()=>drawWeekType(r2)).join(",");
    assert("seeded determinism (deck)", s1===s2 && s1.length>0);
  })();
  // 2. 스테로이드 조교: 컨디션 +22, 노출 +2
  (function(){
    const st = newState(1); const before = {fit:st.horses[0].fit, heat:st.heat};
    applyPrep(st, 0, "steroid", Math.random);
    assert("steroid +22 fit", st.horses[0].fit === Math.min(100, before.fit+RULES.STEROID_FIT));
    assert("steroid +2 heat", st.heat === before.heat + RULES.STEROID_HEAT && st.everDoped === true);
  })();
  // 3. 노출 자연 감쇠 -0.5/주
  (function(){
    const st = newState(1); st.heat = 2.4; tickWeek(st);
    assert("heat decay 0.5", st.heat === 1.9);
  })();
  // 4. 적발 확률: 노출 0 → 0, 노출 10 → 상한 0.85
  (function(){
    assert("catchProb 0 at heat 0", catchProb(0) === 0);
    assert("catchProb cap at heat 10", Math.abs(catchProb(10) - RULES.CATCH_CAP) < 1e-9);
  })();
  // 5. 노출 0 검사 → 음성 + 평판 +4
  (function(){
    const st = newState(1); st.heat = 0;
    const r = runSpotTest(st, Math.random);
    assert("clean test pass", r.caught === false && st.rep === 74);
  })();
  // 6. 강제 양성: 노출 10 → 6주 정지·평판 -25·스트라이크 1
  (function(){
    const st = newState(1); st.heat = 10;
    const r = runSpotTest(st, ()=>0.0); /* 0 < 0.85 → 확정 적발 */
    assert("caught suspension 6w", r.caught === true && st.horses.some(h=>h.sus===RULES.SUSPEND_WEEKS));
    assert("caught rep -25 & strike", st.rep === 45 && st.strikes === 1);
  })();
  // 7. 2차 적발 → 8년 정지 배드 엔딩
  (function(){
    const st = newState(1); st.heat = 10; st.strikes = 1;
    const r = runSpotTest(st, ()=>0.0);
    assert("2nd catch = ban ending", r.ban === true && st.phase === "over" && st.ending === "ban");
  })();
  // 8. 표준 재활 vs 가속 재활
  (function(){
    const a = newState(1), b = newState(1);
    applyInjury(a, 0, false, Math.random); applyInjury(b, 0, true, Math.random);
    assert("rehab weeks 3 / fast 1 + heat", a.horses[0].inj===3 && b.horses[0].inj===1 && b.heat===2);
  })();
  // 9. 부상 재발 위험 반영: 재발 이력 말의 rollInjury 확률 상승
  (function(){
    const st = newState(1); st.horses[0].recur = 1; st.horses[0].fit = 50;
    let hits = 0;
    for(let i=0;i<2000;i++){ st.horses[0].inj = 0; if(rollInjury(st, 0, mulberry32(i))) hits++; }
    assert("recurrence risk >45% (50% base)", hits > 900); /* recur=1 → 0.56 */
  })();
  // 10. 레이스 승리 → wins 증가·평판 +3
  (function(){
    const st = newState(1); st.horses[0].fit = 100; st.runs = 0;
    const r = runRace(st, 0, ()=>1); /* rng=1 → mine 최대, 상대 최소 */
    assert("race win path", r.rank === 1 && st.wins === 1 && st.runs === 1);
  })();
  // 11. 시즌 종료: 12주 경과 → 종결 + 클린 보너스
  (function(){
    const a = newState(1), b = newState(1);
    a.week = RULES.WEEKS; a.heat = 0.2; tickWeek(a);
    assert("season ends at week 12 pass", a.week === RULES.WEEKS+1);
    const s1 = endSeason(cloneState(b));
    b.everDoped = true; const s2 = endSeason(b);
    assert("clean bonus 300 only if no dope", s1.cleanBonus === 300 && s2.cleanBonus === 0);
  })();
  // 12. 결정론 시뮬: 동일 시드 두 시즌 로그 완전 일치
  (function(){
    function sim(seed){
      const st = newState(seed); const rng = mulberry32(seed);
      while(st.phase!=="over"){
        const t = drawWeekType(rng);
        if(t==="test"){ runSpotTest(st, rng); if(st.phase==="over") break; }
        else if(t==="race"){
          const h = st.horses.find(x=>x.inj===0&&x.sus===0);
          if(h){ applyPrep(st, h.id, "work", rng); runRace(st, h.id, rng); }
        }
        if(st.week >= RULES.WEEKS){ endSeason(st); break; }
        tickWeek(st);
      }
      return st;
    }
    const r1 = sim(77), r2 = sim(77);
    assert("full-season determinism", JSON.stringify(r1)===JSON.stringify(r2) && r1.phase==="over");
  })();

  // UI 기동 + 텍스트 건전성
  try{
    startSeason(20260901);
    const txt = render_game_to_text();
    assert("render text sanity (no NaN/undefined)", !/undefined|NaN/.test(txt));
  }catch(err){ assert("render boots", false); pageErrors.push(String(err)); }

  window.__qaResult = { pass: pass && pageErrors.length===0, total:A.length, failed:A.filter(x=>!x.ok), assertions:A, pageErrors };
  window.__cleanSteward = { state:()=>S, rules:RULES, catchProb, applyPrep, runSpotTest, applyInjury, runRace, tickWeek, endSeason, seasonScore };
})();
</script>
