<!DOCTYPE html>
<!--
  CROWN QUEST — 크라운 퀘스트
  경마 연구 → 게임 브릿지 chain #4 (GAME_CONNECTION.md 매핑 5행)

  연구 원천 (활용 증거) — 3건:
  1. research/horse-racing/v6/triple-crown-systematics.md
     - 미국 5주 압축 3연전 체계(더비→프리크니스 2주→벨몬트 3주, 1969년 확립)
     - 완주마 13두/106회(12.3%) — 5주 내 3연승의 시간 압박 → "미국형" 모드의 압축 일정·피로 시스템
     - 거리 확장 1900→2012→2400m + 3세 발육 곡선 → 피로·부상 리스크 수치 근거
  2. research/horse-racing/v8/japan-triple-crown-eight.md
     - 일본 거리 계단 2000→2400→3000m — 3번 바뀌는 요구 스탯(속도→지구력→스태미나) → 경주 스테이지 설계
     - 봄 2연전 + 5개월 공백(방목·성장) 구조 → "일본형" 모드의 2연전→방목→가을 결전 일정
     - 무패 3관 확률 ~3.5% (86회 중 3두, 루돌프·딥 임팩트·콘트레일) → 무패 클리어 업적 희귀도 튜닝 기준
     - 미호노 부런(1992) 무패 2관 → 국화상 3000m 스태미나 시험에서 라이스 샤워에게 2착 좌절 → 라이벌 역전 이벤트
     - 딥 임팩트→콘트레일 부자 무패 3관(사상 최초) → 2세대 계승 보너스
  3. research/horse-racing/v8/korea-triple-crown-two.md
     - 한국 삼관 체계 — 200m 균등 계단(1600→1800→2000)·더트 단일 표면
     - 삼관마 20년 2두(제이에스홀드 2007, 파워블레이드 2016) → 희소성·보너스 보정 참조
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크라운 퀘스트 — Crown Quest</title>
<meta name="description" content="5주 일정 경영 시뮬레이션. 일본형(봄 2연전+가을 결전) vs 미국형(5주 압축 3연전) 두 일정 모드를 선택해 트리플 크라운 정복에 도전하세요.">
<meta name="theme-color" content="#0f1420">
<style>
  :root{
    --bg:#0f1420; --bg2:#141b2c; --card:#1b2438; --card-light:#232f4a;
    --border:#2c3a5c; --text:#e8ecf6; --muted:#8b96b3;
    --gold:#f5c542; --gold-dim:#8a6d1f; --crown:#ffd861;
    --accent:#5cc8ff; --good:#5fd38a; --bad:#ff7a7a; --warn:#ffb454;
    --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #1d2a4a 0%, var(--bg) 55%);
    color:var(--text); font-family:var(--font); font-size:15px; line-height:1.5;
    display:flex; justify-content:center; min-height:100dvh;
  }
  #app{
    width:100%; max-width:430px; min-height:100dvh;
    padding:16px 14px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; position:relative;
  }
  header{display:flex; align-items:baseline; justify-content:space-between; padding:2px 2px 10px; border-bottom:2px solid var(--border)}
  header h1{font-size:19px; font-weight:800; letter-spacing:.4px; color:var(--crown)}
  header h1 small{font-size:10px; color:var(--muted); font-weight:600; margin-left:6px; letter-spacing:1px}
  header .sub{font-size:11px; color:var(--muted)}

  .hud{display:flex; gap:6px; padding:10px 0; font-size:11px; font-variant-numeric:tabular-nums}
  .hud .cell{flex:1; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 6px; text-align:center}
  .hud .cell b{display:block; font-size:14px}
  .hud .cell.week b{color:var(--crown)}
  .hud .cell.fat b{color:var(--warn)}
  .hud .cell.stat-spd b{color:var(--accent)}
  .hud .cell.stat-end b{color:var(--good)}
  .hud .cell.stat-sta b{color:var(--bad)}

  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px}
  .panel h2{font-size:15px; margin-bottom:4px}
  .panel .desc{font-size:12px; color:var(--muted); margin-bottom:8px}
  .note{
    font-size:11.5px; color:var(--muted); border-left:3px solid var(--gold);
    padding:4px 8px; margin:8px 0; background:rgba(245,197,66,.06);
  }
  .note.src{font-size:10.5px; border-left-color:var(--accent); background:rgba(92,200,255,.05)}

  button{
    font-family:var(--font); font-size:14px; font-weight:700; color:var(--text);
    background:var(--card-light); border:1.5px solid var(--border); border-radius:10px;
    padding:11px 14px; cursor:pointer; user-select:none; transition:all .15s; text-align:left;
  }
  button:active{transform:scale(.98)}
  button.primary{background:linear-gradient(180deg,#e8b93c,#c9981f); border-color:#f5d76e; color:#241a02; text-align:center}
  button.race-btn{background:linear-gradient(180deg,#e05555,#b53a3a); border-color:#f08a8a; color:#fff; text-align:center}
  button:disabled{opacity:.45; cursor:default; transform:none}
  .btn-grid{display:flex; flex-direction:column; gap:8px; margin-top:8px}

  .mode-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:13px; margin-bottom:12px; cursor:pointer; transition:border-color .15s;
  }
  .mode-card:hover{border-color:var(--gold)}
  .mode-card h3{font-size:15px; color:var(--crown); margin-bottom:2px}
  .mode-card .bar{
    display:flex; gap:4px; margin:8px 0 6px;
  }
  .mode-card .bar i{
    flex:1; height:6px; border-radius:3px; background:var(--border);
  }
  .mode-card .bar i.on{background:var(--gold)}
  .mode-card .tag{font-size:10.5px; color:var(--muted); line-height:1.6}
  .mode-card .risk{font-size:10.5px; font-weight:700}

  .race-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px}
  .race-head .leg{font-size:13px; font-weight:800; color:var(--crown)}
  .race-head .dist{font-size:12px; color:var(--muted)}
  .statline{display:flex; gap:6px; margin:8px 0}
  .statline span{flex:1; text-align:center; font-size:11px; padding:5px 4px; border-radius:8px; background:var(--card-light); border:1px solid var(--border)}
  .statline span.req{background:rgba(245,197,66,.1); border-color:var(--gold-dim)}
  .statline span b{display:block; font-size:13px}

  .result-box{border-radius:10px; padding:12px; margin:8px 0; border:1.5px solid}
  .result-box.win{background:rgba(95,211,138,.08); border-color:var(--good)}
  .result-box.lose{background:rgba(255,122,122,.08); border-color:var(--bad)}
  .result-box h3{font-size:15px; margin-bottom:4px}
  .result-box .ev{font-size:12px; color:var(--muted); line-height:1.6}
  .result-box .ev b{color:var(--text)}

  .stat-big{display:flex; gap:8px; margin:10px 0}
  .stat-big div{flex:1; text-align:center; background:var(--card-light); border:1px solid var(--border); border-radius:10px; padding:8px 4px}
  .stat-big b{display:block; font-size:20px; color:var(--crown)}
  .stat-big span{font-size:10.5px; color:var(--muted)}

  .foot{font-size:10.5px; color:var(--muted); text-align:center; margin-top:auto; padding-top:12px; line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ============ 연구 원천 경로 (활용 증거, 헤더 주석과 동일) ============ */
var SOURCES = [
  {path:'research/horse-racing/v6/triple-crown-systematics.md',
   use:'미국 5주 압축 3연전 체계·피로 누적 — 미국형 모드'},
  {path:'research/horse-racing/v8/japan-triple-crown-eight.md',
   use:'거리 계단 2000→2400→3000m 요구 스탯 전환·무패 3관 3.5%·미호노 부런·딥→콘트레일'},
  {path:'research/horse-racing/v8/korea-triple-crown-two.md',
   use:'삼관 체계 희소성(20년 2두) — 업적 희귀도 보정 참조'}
];

/* ============ 상태 ============ */
var LS_KEY = 'crown-quest-v1';
var S = null;

var INIT = {spd:45, end:45, sta:45, fatigue:0};
var TRAIN_FAT = 4;
var REST_REC = 16;
var PASTURE = {spd:9, end:9, sta:9, fatigue:-22};
var RACE_FAT = {jp:14, us:18};
var RIVAL_PEN = {jp:10, us:8};
var FAT_COEF = {jp:0.5, us:0.7};
var WIN_A = 0.45, WIN_K = 0.045, WIN_MIN = 0.04, WIN_MAX = 0.97;
var OTHER_W = 0.25;           // 보조 스탯(2스탯 평균) 가중치
var MARGIN_D = 6;             // 마진 = 1 + floor((perf-req)/MARGIN_D)
var UNDEFEATED_MIN = 5;       // 무패 = 3연승 && 마진 합 ≥ 5

var CALENDAR = {
  jp: [
    {t:'action', label:'1주차 — 봄 준비 훈련', help:'4월 皐月賞을 향한 마지막 조교. 한 가지 스탯을 집중 훈련합니다.'},
    {t:'race',  name:'皐月賞 사츠키상', leg:'제1관문', dist:2000, req:{spd:50}, focus:'SPD',
      flavor:'나카야마 2000m — 등반이 있는 스피드 시험. 무패 도전의 출발점.'},
    {t:'race',  name:'日本ダービー 도쿄 유슌', leg:'제2관문', dist:2400, req:{end:52}, focus:'END',
      flavor:'도쿄 후추 2400m 직선 525.9m. 봄 2연전의 둘째 관문 — 피로가 쌓인다.'},
    {t:'pasture', label:'여름 방목 — 장기 공백', help:'더비 후 5개월의 공백. 방목·성장으로 전 스탯 상승 + 피로 대폭 회복.'},
    {t:'race',  name:'菊花賞 국화상', leg:'제3관문', dist:3000, req:{sta:62}, focus:'STA', rival:true,
      flavor:'교토 3000m 스태미나 상한. 1992년 미호노 부런이 라이스 샤워에게 2착으로 좌절한 그 거리.'}
  ],
  us: [
    {t:'race',  name:'켄터키 더비', leg:'제1관문', dist:2012, req:{spd:54}, focus:'SPD',
      flavor:'처칠다운스 2012m. "가장 두 번째로 뛰어난 2분." 5주 압축의 시작.'},
    {t:'action', label:'2주차 — 회복/훈련', help:'더비 후 2주. 프리크니스까지 회복이 관건. 훈련은 강해지지만 피로가 쌓인다.'},
    {t:'race',  name:'프리크니스 스테이크스', leg:'제2관문', dist:1900, req:{spd:56,end:56}, focus:'SPD+END',
      flavor:'볼티모어 1900m. 더비 2주 후 — 압축 일정의 단축거리 승부.'},
    {t:'action', label:'4주차 — 회복/훈련', help:'프리크니스 후 3주. 벨몬트의 지구력 시험(Test of the Champion)을 준비한다.'},
    {t:'race',  name:'벨몬트 스테이크스', leg:'제3관문', dist:2400, req:{end:50}, focus:'END', rival:true,
      flavor:'뉴욕 2400m — "3세의 시험". 1978년 어펌드-알리다의 1마신 접전처럼, 라이벌이 결승 직전 덤벼든다.'}
  ]
};

var MODE_META = {
  jp: {name:'일본형 — 봄 2연전 + 가을 결전', risk:'리스크: 최장 3000m 거리 계단(속도→지구력→스태미나) + 최종 관문 라이벌 역전',
       weeks:[1,1,1,1,1]},
  us: {name:'미국형 — 5주 압축 3연전', risk:'리스크: 5주 내 3경주 압축 — 경주 피로 +50%·회복 시간 부족',
       weeks:[1,1,1,1,1]}
};

/* ============ 저장 ============ */
function loadLS(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return {plays:0, clears:{jp:0,us:0}, undefeated:0, legacy:null, bestWins:0};
    return JSON.parse(raw);
  }catch(e){ return {plays:0, clears:{jp:0,us:0}, undefeated:0, legacy:null, bestWins:0}; }
}
function saveLS(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S.meta)); }catch(e){} }

/* ============ RNG (seeded) ============ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(20260908);

/* ============ 순수 로직 ============ */
function statOf(h, focus){
  if(focus === 'SPD') return h.spd;
  if(focus === 'END') return h.end;
  if(focus === 'STA') return h.sta;
  // SPD+END 등 복합: 해당 스탯 평균
  var parts = focus.split('+'), sum = 0;
  for(var i=0;i<parts.length;i++){
    if(parts[i]==='SPD') sum += h.spd;
    if(parts[i]==='END') sum += h.end;
    if(parts[i]==='STA') sum += h.sta;
  }
  return sum / parts.length;
}
function otherAvg(h, focus){
  var keys = {SPD:'spd', END:'end', STA:'sta'};
  var ex = focus.split('+').map(function(f){return keys[f];});
  var sum = 0, n = 0;
  for(var k in keys){ if(ex.indexOf(keys[k]) === -1){ sum += h[keys[k]]; n++; } }
  return n ? sum/n : 0;
}
// 경주 성능 지수
function perfOf(S){
  var c = S.cal[S.week];
  var f = S.horse.fatigue;
  var coef = FAT_COEF[S.mode];
  var pen = f * coef;
  if(c.rival) pen += RIVAL_PEN[S.mode];
  return statOf(S.horse, c.focus) + OTHER_W * otherAvg(S.horse, c.focus) - pen;
}
// 승리 확률
function winProb(req, p){
  var v = WIN_A + (p - req) * WIN_K;
  return Math.max(WIN_MIN, Math.min(WIN_MAX, v));
}
// 마진 (승리 시 ≥1)
function marginOf(p, req){ return 1 + Math.floor(Math.max(0, p - req) / MARGIN_D); }
function clampFloor(x, lo){ return x < lo ? lo : x; }

/* ============ 상태 생성 ============ */
function newState(){
  return {
    phase:'title', mode:null, week:0,
    horse:{name:'크라운 스톰', spd:INIT.spd, end:INIT.end, sta:INIT.sta, fatigue:INIT.fatigue},
    cal:null, results:[], legacyBonus:false,
    meta:loadLS()
  };
}
function cloneHorse(h){ return {name:h.name, spd:h.spd, end:h.end, sta:h.sta, fatigue:h.fatigue}; }

/* ============ 액션 ============ */
function startGame(mode){
  S = newState();
  S.phase = 'play';
  S.mode = mode;
  S.cal = CALENDAR[mode];
  S.week = 0;
  S.meta.plays++;
  if(S.meta.legacy){
    S.legacyBonus = true;
    S.horse.spd += 6; S.horse.end += 6; S.horse.sta += 6; // 부자 계승 보너스
  }
  saveLS();
  render();
}
// 행동 주차: action(kind) — train_spd/train_end/train_sta/rest
function action(kind){
  if(S.phase !== 'play') return {ok:false};
  var c = S.cal[S.week];
  if(!c || c.t !== 'action') return {ok:false};
  var h = S.horse;
  if(kind === 'rest'){
    h.fatigue = Math.max(0, h.fatigue - REST_REC);
  } else {
    var st = {train_spd:'spd', train_end:'end', train_sta:'sta'}[kind];
    if(!st) return {ok:false};
    h[st] += 12;
    h.fatigue += TRAIN_FAT;
  }
  S.week++;
  render();
  return {ok:true};
}
// 방목 주차 (자동 — 버튼으로 확인)
function pasture(){
  if(S.phase !== 'play') return {ok:false};
  var c = S.cal[S.week];
  if(!c || c.t !== 'pasture') return {ok:false};
  var h = S.horse;
  h.spd += PASTURE.spd; h.end += PASTURE.end; h.sta += PASTURE.sta;
  h.fatigue = Math.max(0, h.fatigue + PASTURE.fatigue);
  S.week++;
  render();
  return {ok:true, grown:PASTURE};
}
// 경주 실행
function race(){
  if(S.phase !== 'play' && S.phase !== 'result') return {ok:false};
  var c = S.cal[S.week];
  if(!c || c.t !== 'race') return {ok:false};
  var req;
  if(c.focus.indexOf('+') > -1){
    req = (c.req.spd + c.req.end) / 2;
  } else {
    req = c.req[c.focus.toLowerCase()];
  }
  var p = perfOf(S);
  var wp = winProb(req, p);
  var win = rng() < wp;
  var m = win ? marginOf(p, req) : 0;
  S.horse.fatigue += RACE_FAT[S.mode];
  var res = {leg:c.leg, name:c.name, dist:c.dist, req:req, perf:Math.round(p*10)/10,
             winP:Math.round(wp*100), win:win, margin:m, rival:c.rival};
  // 라이벌 역전: 패배 시 이벤트 텍스트 (미호노 부런·어펌드-알리다)
  if(!win){
    if(S.mode === 'jp' && c.rival){
      res.event = '라이스 샤워가 菊花賞 3000m 스태미나 시험에서 2착으로 밀어냈다. 1992년 미호노 부런 — 무패 2관의 좌절이 재현된다.';
    } else if(S.mode === 'us' && c.rival){
      res.event = '알리다가 결승 직전 역전! 1978년 어펌드-알리다의 1마신 접전처럼, 라이벌이 마지막 순간 덤벼들었다.';
    } else {
      res.event = S.mode === 'jp'
        ? '거리 계단이 당신을 걸렀다. 2000m의 스피드가 2400m에서 지구력으로, 3000m에서 스태미나로 — 요구 체형이 바뀌는 순간 무너졌다.'
        : '5주 압축 일정의 피로가 발목을 잡았다. 회복 시간이 없는 3연전 — 미국 트리플 크라운의 본질적 난이도다.';
    }
  } else if(c.rival){
    res.event = '라이벌의 추격을 마진 ' + m + '마신 차로 물리쳤다. ' + (S.mode==='jp'
      ? '무패 2관마 미호노 부런을 넘어선 그 자리 — 이제 역사의 반열이다.'
      : '1978년 어펌드가 알리다를 1마신 차로 꺾은 그 승부를 재현했다.');
  }
  S.results.push(res);
  S.week++;
  // 게임 종료 판정
  if(S.week >= S.cal.length){
    finish();
  } else {
    S.phase = 'result'; // 경주 결과 화면 표시용
  }
  render();
  return {ok:true, res:res};
}
function finish(){
  var wins = S.results.filter(function(r){return r.win;}).length;
  var margSum = S.results.reduce(function(a,r){return a + r.margin;}, 0);
  var cleared = wins === 3;
  var undefeated = cleared && margSum >= UNDEFEATED_MIN;
  S.phase = 'summary';
  S.outcome = {
    cleared: cleared,
    undefeated: undefeated,
    wins: wins,
    margSum: margSum,
    newRecord: wins > S.meta.bestWins
  };
  if(cleared){
    S.meta.clears[S.mode] = (S.meta.clears[S.mode]||0) + 1;
    if(undefeated) S.meta.undefeated++;
  }
  if(S.outcome.newRecord) S.meta.bestWins = wins;
  saveLS();
}
// 계승 (2세대) — 딥 임팩트 → 콘트레일 부자 무패 3관 패턴
function legacyStart(){
  if(S.phase !== 'summary' || !S.outcome.cleared) return {ok:false};
  S.meta.legacy = {
    name: S.horse.name,
    gen: (S.meta.legacy ? S.meta.legacy.gen : 0) + 1,
    spd:6, end:6, sta:6
  };
  saveLS();
  S = newState();
  S.phase = 'title';
  render();
  return {ok:true};
}
function resetAll(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  S = newState();
  render();
  return {ok:true};
}

/* ============ 렌더 ============ */
function el(id){ return document.getElementById(id); }
function setHTML(id, html){ var e = el(id); if(e) e.innerHTML = html; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hudHTML(){
  if(S.phase === 'title') return '';
  var h = S.horse, w = Math.min(S.week + 1, S.cal.length);
  var fatPct = Math.min(100, Math.round(h.fatigue / 60 * 100));
  return '<div class="hud">'
    + '<div class="cell week">주차<b>' + w + '/' + S.cal.length + '</b></div>'
    + '<div class="cell stat-spd">속도<b>' + h.spd + '</b></div>'
    + '<div class="cell stat-end">지구력<b>' + h.end + '</b></div>'
    + '<div class="cell stat-sta">스태미나<b>' + h.sta + '</b></div>'
    + '<div class="cell fat">피로<b>' + fatPct + '%</b></div>'
    + '</div>';
}

function legacyBanner(){
  if(!S.legacyBonus || !S.meta.legacy) return '';
  return '<div class="note">👑 부자 계승 — 아버지 <b>' + esc(S.meta.legacy.name) + '</b>의 무패 3관 (딥 임팩트 → 콘트레일 패턴). '
    + '2세대 보너스: 전 스탯 +6 적용됨.</div>';
}

function renderTitle(){
  var m = S.meta;
  var html = '<header><h1>크라운 퀘스트 <small>CROWN QUEST</small></h1><span class="sub">5주 일정 경영</span></header>'
    + '<div class="panel" style="margin-top:12px">'
    + '<h2>👑 트리플 크라운에 도전하라</h2>'
    + '<p class="desc">3세 마필 ' + esc(S.horse.name) + '을 5주 동안 조련해 3관문을 석권하세요. 일정 모드에 따라 리스크의 정체가 완전히 다릅니다.</p>'
    + '<div class="mode-card" id="mc-jp">'
    + '<h3>🇯🇵 일본형 — 봄 2연전 + 가을 결전</h3>'
    + '<div class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>'
    + '<p class="tag">2000m → 2400m → 3000m 거리 계단. 요구 스탯이 속도→지구력→스태미나로 바뀝니다. 더비 후 여름 방목(전 스탯 +9)이 열쇠. 최종 국화상 3000m엔 라이벌 라이스 샤워가 기다립니다.</p>'
    + '<p class="risk">⚖️ 리스크: 최장 3000m 스태미나 시험 + 최종 관문 라이벌 역전</p>'
    + '</div>'
    + '<div class="mode-card" id="mc-us">'
    + '<h3>🇺🇸 미국형 — 5주 압축 3연전</h3>'
    + '<div class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>'
    + '<p class="tag">더비 → (2주) → 프리크니스 → (3주) → 벨몬트. 5주 내 3경주 — 경주 피로가 50% 더 쌓이고 회복 시간이 없습니다. 훈련 vs 휴양의 밸런스가 생존의 관건.</p>'
    + '<p class="risk">⚖️ 리스크: 압축 일정 피로 누적 (경주 피로 +18, 휴양으로만 회복)</p>'
    + '</div>'
    + '<div class="stat-big">'
    + '<div><b>' + m.plays + '</b><span>플레이</span></div>'
    + '<div><b>' + ((m.clears.jp||0)+(m.clears.us||0)) + '</b><span>3관 클리어</span></div>'
    + '<div><b>' + m.undefeated + '</b><span>무패 3관</span></div>'
    + '</div>'
    + (m.legacy ? '<div class="note">👑 계승 혈통: <b>' + esc(m.legacy.name) + '</b> ' + m.legacy.gen + '세대 — 다음 시작 시 전 스탯 +6</div>' : '')
    + '<div class="note">🎯 무패 3관 달성률은 ~3.5%로 튜닝 — 역사상 3두(심볼리 루돌프·딥 임팩트·콘트레일)뿐인 희소성 (v8 1호 §3.2)</div>'
    + '</div>'
    + '<div class="panel"><h2>📜 연구 원천</h2>'
    + SOURCES.map(function(s){ return '<div class="note src">📄 ' + esc(s.path) + '<br>' + esc(s.use) + '</div>'; }).join('')
    + '</div>'
    + '<div class="btn-grid"><button class="primary" id="btn-reset">🗑 저장 기록 초기화</button></div>'
    + '<div class="foot">chain #4 · 경영/스케줄 관리 · 단일 HTML (의존성 없음)</div>';
  setHTML('app', html);
  bind('mc-jp', function(){ startGame('jp'); });
  bind('mc-us', function(){ startGame('us'); });
  bind('btn-reset', function(){ if(confirm('기록을 모두 지울까요?')) resetAll(); });
}

function renderPlay(){
  var c = S.cal[S.week];
  var html = '<header><h1>크라운 퀘스트</h1><span class="sub">' + (S.mode==='jp'?'일본형':'미국형') + ' · ' + S.horse.name + '</span></header>'
    + hudHTML() + legacyBanner()
    + '<div class="panel"><h2>' + esc(c.label || c.name) + '</h2><p class="desc">' + esc(c.help || c.flavor) + '</p>';
  if(c.t === 'action'){
    html += '<div class="btn-grid">'
      + '<button data-a="train_spd">⚡ 속도 훈련 (+12, 피로 +4)</button>'
      + '<button data-a="train_end">🛡 지구력 훈련 (+12, 피로 +4)</button>'
      + '<button data-a="train_sta">⛰ 스태미나 훈련 (+12, 피로 +4)</button>'
      + '<button data-a="rest">💤 휴양 (피로 -16)</button>'
      + '</div></div>';
  } else if(c.t === 'pasture'){
    html += '<div class="btn-grid"><button class="primary" id="btn-pasture">🌿 방목 시작 (전 스탯 +9, 피로 -22)</button></div></div>';
  } else { // race
    var reqTxt = c.focus.indexOf('+') > -1 ? '속도·지구력' : ({SPD:'속도',END:'지구력',STA:'스태미나'})[c.focus];
    html += '<div class="race-head"><span class="leg">' + esc(c.leg) + '</span><span class="dist">' + c.dist + 'm · 요구: ' + reqTxt + '</span></div>'
      + '<div class="statline">'
      + '<span>속도 <b>' + S.horse.spd + '</b></span>'
      + '<span>지구력 <b>' + S.horse.end + '</b></span>'
      + '<span>스태미나 <b>' + S.horse.sta + '</b></span>'
      + '<span class="req">피로 <b>' + S.horse.fatigue + '</b></span>'
      + '</div>'
      + '<div class="note">' + esc(c.flavor) + '</div>'
      + '<div class="btn-grid"><button class="race-btn" id="btn-race">🏇 출주! ' + c.dist + 'm</button></div></div>';
  }
  setHTML('app', html);
  if(c.t === 'action'){
    var btns = document.querySelectorAll('[data-a]');
    for(var i=0;i<btns.length;i++){ (function(b){ bind2(b, function(){ action(b.getAttribute('data-a')); }); })(btns[i]); }
  } else if(c.t === 'pasture'){
    bind('btn-pasture', function(){ pasture(); });
  } else {
    bind('btn-race', function(){ race(); });
  }
}

function renderRaceResult(){
  var r = S.results[S.results.length - 1];
  var html = '<header><h1>크라운 퀘스트</h1><span class="sub">' + (S.mode==='jp'?'일본형':'미국형') + '</span></header>'
    + hudHTML() + legacyBanner()
    + '<div class="panel"><h2>' + esc(r.name) + ' 결과</h2>'
    + '<div class="result-box ' + (r.win?'win':'lose') + '">'
    + '<h3>' + (r.win ? '🏆 우승 — 마진 ' + r.margin + '마신' : '💔 패배 — ' + esc(r.name) + ' 좌절') + '</h3>'
    + '<p class="ev">성능 지수 ' + r.perf + ' / 요구 ' + r.req + ' · 예상 승률 ' + r.winP + '%</p>'
    + (r.event ? '<p class="ev"><b>📖</b> ' + esc(r.event) + '</p>' : '')
    + '</div>'
    + (S.phase === 'summary' ? '' : '<div class="btn-grid"><button class="primary" id="btn-next">다음 주차 →</button></div>')
    + '</div>';
  if(S.phase === 'summary'){
    html += renderSummaryInner();
  }
  setHTML('app', html);
  if(S.phase !== 'summary') bind('btn-next', function(){ S.phase = 'play'; render(); });
}

function renderSummaryInner(){
  var o = S.outcome;
  var h = '<div class="panel" style="border-color:var(--gold-dim)">'
    + '<h2>' + (o.cleared ? '👑 트리플 크라운 달성!' : '🌫 3관 도전 실패') + '</h2>'
    + '<div class="stat-big">'
    + '<div><b>' + o.wins + '</b><span>승리</span></div>'
    + '<div><b>' + (o.cleared ? '3관' : '미달') + '</b><span>클리어</span></div>'
    + '<div><b>' + (o.undefeated ? '무패!' : '-') + '</b><span>' + o.margSum + ' 마진</span></div>'
    + '</div>';
  if(o.undefeated){
    h += '<div class="result-box win"><h3>✨ 무패 3관 업적 달성 (~3.5% 희귀도)</h3>'
      + '<p class="ev">심볼리 루돌프 · 딥 임팩트 · 콘트레일 — 역사상 3두뿐인 무패 3관 체계 (v8 1호 §3). 마진 합 ' + o.margSum + '로 완승.</p></div>';
  }
  if(o.cleared){
    h += '<div class="btn-grid">'
      + '<button class="primary" id="btn-legacy">👨‍👦 계승 — 2세대 시작 (전 스탯 +6)</button>'
      + '<button id="btn-again">🔁 다시 도전</button></div>';
  } else {
    h += '<div class="btn-grid"><button class="primary" id="btn-again">🔁 다시 도전</button></div>';
  }
  h += '<div class="note">📖 ' + (o.cleared
    ? (o.undefeated
      ? '무패 3관 → 2세대 계승은 딥 임팩트 → 콘트레일 부자 무패 3관(사상 최초)을 계승한 구조다.'
      : '클리어 후 계승 시 2세대는 전 스탯 +6 보너스 — 콘트레일이 딥 임팩트의 아들로 태어난 혈통 계승이다.')
    : '라이벌이 기다리는 마지막 관문. "무패 2관의 좌절"(1992 미호노 부런)과 "37년 공백"(1978→2015 미국)이 이 게임의 난이도다.') + '</div>'
    + '<div class="note">📊 모드별 3관 클리어: 일본 ' + (S.meta.clears.jp||0) + '회 / 미국 ' + (S.meta.clears.us||0) + '회 · 무패 ' + S.meta.undefeated + '회</div>'
    + '</div>';
  return h;
}

function renderSummary(){
  var html = '<header><h1>크라운 퀘스트</h1><span class="sub">결산</span></header>'
    + '<div class="panel"><h2>🗒 5주 일정 결과</h2>'
    + S.results.map(function(r){
      return '<div class="result-box ' + (r.win?'win':'lose') + '">'
        + '<h3>' + esc(r.leg) + ' ' + esc(r.name) + (r.win ? ' — 마진 ' + r.margin + '마신' : ' — 패') + '</h3>'
        + '<p class="ev">' + r.dist + 'm · 요구 ' + r.req + ' · 성능 ' + r.perf + ' · 예상 승률 ' + r.winP + '%</p>'
        + '</div>';
    }).join('')
    + '</div>'
    + renderSummaryInner();
  setHTML('app', html);
  bind('btn-again', function(){ S = newState(); render(); });
  var bl = el('btn-legacy');
  if(bl) bind('btn-legacy', function(){ legacyStart(); });
}

function render(){
  if(!S) S = newState();
  if(S.phase === 'title') renderTitle();
  else if(S.phase === 'play') renderPlay();
  else if(S.phase === 'result') renderRaceResult();
  else if(S.phase === 'summary') renderSummary();
  else renderTitle();
}

/* ============ DOM 바인딩 헬퍼 ============ */
var _binds = {};
function bind(id, fn){
  _binds[id] = fn;
  var e = el(id);
  if(e && e.addEventListener) e.addEventListener('click', fn);
}
function bind2(elem, fn){
  if(elem && elem.addEventListener) elem.addEventListener('click', fn);
}

window.CQ = {

  pasture:pasture,
  race:race,
  resetAll:resetAll,
  legacyStart:legacyStart,
  finish:finish,

  _calc:{

  },

};

if(typeof document !== 'undefined' && document.getElementById){
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ try{ S = newState(); render(); }catch(e){} });
  } else {
    try{ S = newState(); render(); }catch(e){}
  }
}
})();
