<html lang="ko">
<head>

  <meta property="og:title" content="Fossil Fracture — 화석 균열 발굴">

  <link rel="canonical" href="https://eastsea-blog.pages.dev/games/fossil-fracture/">
  <title>Fossil Fracture — 화석 균열 발굴</title>
  <style>
    :root{color-scheme:light;--sand:#f4e4c1;--ivory:#fff3d0;--fault:#9d5745;--ink:#2f6d6a;--text:#3d3328;--gold:#c79235;--paper:#fff9e9}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overflow-x:hidden;background:#d7bd86;color:var(--text);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif}
    body{min-height:100svh;background:radial-gradient(circle at 50% 0,#fff7df 0,#ead4a5 44%,#b98353 130%);padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:none}
    button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:48px}

    .daily{background:#fff8e7d9;border:1px solid #b78c4b;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:850;box-shadow:0 3px 0 #a8793f33}

    .stress-track{height:8px;flex:1;border-radius:99px;background:#ffffff2e;overflow:hidden}.stress-fill{height:100%;width:0;background:linear-gradient(90deg,#6ec7b8,#f1cc5e,#d66a4a);transition:width .05s}

    .hidden{display:none!important}
    .card{width:100%;max-width:340px;border:2px solid #caa65d;border-radius:22px;background:linear-gradient(145deg,#fffaf0,#f4dfb6);padding:20px 18px;text-align:center;box-shadow:0 12px 36px #21160c66,inset 0 0 0 4px #fff9dc}
    .seal{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff3d0;border:4px double #dfbd68;font-size:28px;box-shadow:0 4px 0 #24514f}
    h1,h2,p{margin:0}h1{font:950 30px/.95 Georgia,serif;letter-spacing:-.04em}h1 em{display:block;font:850 13px/1.2 ui-rounded,system-ui;color:var(--fault);letter-spacing:.12em;margin-top:8px;font-style:normal}h2{font:950 24px/1.05 Georgia,serif}
    .lede{font-size:13px;line-height:1.55;margin:13px auto;color:#614b36}.record{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:13px 0}.record div{border:1px dashed #af8852;background:#fffaf1;border-radius:12px;padding:9px}.record span{display:block;font-size:9px;font-weight:800;color:#80603f}.record b{font-size:17px}
    .primary{width:100%;border-radius:14px;background:var(--ink);color:#fff9df;font-weight:950;box-shadow:0 5px 0 #24504e;padding:0 18px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #24504e}
    .secondary{margin-top:9px;width:100%;border-radius:14px;background:#fffaf0;border:1px solid #96744b;font-weight:900}

    .grade{font:950 38px/1 Georgia,serif;color:var(--gold);text-shadow:0 2px #fff;margin:6px}.result-copy{font-size:12px;line-height:1.55}.build{margin:7px 0 13px;font-size:10px;color:#735735;min-height:15px}
    .toast{position:absolute;z-index:3;top:80px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#2f6d6aeb;color:#fff8dc;border:1px solid #e2c66f;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:900;white-space:nowrap;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .shake{animation:shake .22s linear}.reveal{animation:reveal .65s ease-out}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes reveal{0%{filter:brightness(2);transform:scale(.94)}100%{filter:none;transform:none}}
    @media(max-height:720px){body{padding-top:5px}.tip{padding-top:8px}.card{padding:14px}.specimen{height:78px;margin:8px 0}canvas{aspect-ratio:360/410}}
  </style>

<body>
<main class="shell" itemscope itemtype="https://schema.org/VideoGame">
  <meta itemprop="name" content="Fossil Fracture — 화석 균열 발굴">
  <meta itemprop="applicationCategory" content="Game">
  <meta itemprop="operatingSystem" content="Web Browser">
  <header><div class="brand">Fossil Fracture<small>화석 균열 발굴</small></div><div class="daily" id="dailyBadge">Daily Stratum #000</div></header>
  <section class="hud" id="hud" aria-label="발굴 상태">
    <div class="stat"><span>지층</span><b id="stageText">1 / 5</b></div>
    <div class="stat"><span>노출도</span><b id="exposureText">0%</b></div>
    <div class="stat"><span>보존도</span><b id="preservationText">100</b></div>
    <div class="stat"><span>타격 수</span><b id="strikesText">7</b></div>
  </section>
  <section class="board" id="board">
    <canvas id="gameCanvas" width="360" height="452" aria-label="암반 발굴판. 드래그해 응력선을 그리세요."></canvas>
    <div class="stress"><span>응력</span><div class="stress-track"><div class="stress-fill" id="stressFill"></div></div><b id="stressText">0%</b></div>
    <div class="toast" id="toast">무손상 균열!</div>
    <section class="overlay" id="titleOverlay">
      <div class="card"><div class="seal">⛏</div><h1>Fossil<br>Fracture<em>화석 균열 발굴</em></h1><p class="lede">응력선을 그리고 놓으세요.<br>화석은 지키고, 주변 암반만 갈라냅니다.</p><div class="record"><div><span>최고 점수</span><b id="bestText">0</b></div><div><span>최고 무손상</span><b id="bestStreakText">0</b></div></div><button class="primary" id="startBtn">오늘의 지층 발굴</button></div>
    </section>
    <section class="overlay hidden" id="draftOverlay">
      <div class="card"><div class="seal">⚒</div><h2>보존 도구 선택</h2><p class="lede">다음 지층의 균열 성질이 달라집니다.</p><div class="draft-grid"><button class="tool" data-tool="fine"><strong>Fine Chisel · 정밀 끌</strong><span>균열 폭 축소, 안전 점수 +35%</span></button><button class="tool" data-tool="mallet"><strong>Resonance Mallet · 공명 망치</strong><span>제거 폭 증가, 화석 손상 위험 증가</span></button><button class="tool" data-tool="clamp"><strong>Plaster Clamp · 석고 클램프</strong><span>다음 화석 손상 1회를 완전히 방어</span></button></div></div>
    </section>
    <section class="overlay hidden" id="resultOverlay">
      <div class="card" id="museumCard"><h2 id="resultTitle">박물관 표본 완성</h2><div class="specimen"></div><div class="grade" id="gradeText">A</div><p class="result-copy" id="resultCopy">점수 0 · 무손상 연쇄 0</p><div class="build" id="buildText">도구: 기본 장비</div><button class="primary" id="retryBtn">같은 지층 재도전</button><button class="secondary" id="titleBtn">박물관 로비</button></div>
    </section>
  </section>
  <p class="tip" id="tipText">드래그 길이와 굴곡이 클수록 균열이 넓게 번집니다.</p>
</main>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id), canvas=$('gameCanvas'),ctx=canvas.getContext('2d');
  const W=360,H=452,COLS=12,ROWS=14,CW=W/COLS,CH=400/ROWS,TOP=16,KEY='fossil-fracture-v1';
  const els={title:$('titleOverlay'),draft:$('draftOverlay'),result:$('resultOverlay'),stage:$('stageText'),exposure:$('exposureText'),preservation:$('preservationText'),strikes:$('strikesText'),stress:$('stressFill'),stressText:$('stressText'),tip:$('tipText'),toast:$('toast'),daily:$('dailyBadge'),best:$('bestText'),bestStreak:$('bestStreakText'),resultTitle:$('resultTitle'),resultCopy:$('resultCopy'),build:$('buildText'),grade:$('gradeText'),card:$('museumCard')};
  const configs=[
    {strength:1,branches:1,target:38,strikes:8,name:'Sunstone Shelf'},
    {strength:2,branches:2,target:45,strikes:8,name:'Ochre Fault'},
    {strength:2,branches:3,target:52,strikes:7,name:'Shellbed Fold'},
    {strength:3,branches:4,target:58,strikes:7,name:'Red Clay Rift'},
    {strength:4,branches:5,target:64,strikes:6,name:'Ivory Deep'}
  ];
  const masks=[
    [[5,5],[6,5],[4,6],[5,6],[6,6],[7,6],[5,7],[6,7],[4,8],[7,8]],
    [[5,4],[6,4],[4,5],[5,5],[6,5],[7,5],[4,6],[7,6],[5,7],[6,7],[3,8],[8,8]],
    [[4,4],[5,4],[6,4],[7,4],[3,5],[8,5],[4,6],[7,6],[5,7],[6,7],[4,8],[7,8],[3,9],[8,9]],
    [[5,3],[6,3],[4,4],[7,4],[3,5],[8,5],[4,6],[5,6],[6,6],[7,6],[3,7],[8,7],[4,8],[7,8],[5,9],[6,9]],
    [[4,3],[5,3],[6,3],[7,3],[3,4],[8,4],[2,5],[9,5],[3,6],[4,6],[5,6],[6,6],[7,6],[8,6],[3,7],[8,7],[4,8],[7,8],[5,9],[6,9]]
  ];
  const tools={fine:{label:'정밀 끌',radius:-.38,safe:1.35,damage:.65},mallet:{label:'공명 망치',radius:.6,safe:1,damage:1.35},clamp:{label:'석고 클램프',radius:0,safe:1,damage:1}};
  let save=readSave(),state,grid=[],trail=[],dust=[],cracks=[],drawing=false,lastTime=0,raf=0,audio=null;
  const today=localDateKey(),seed=hash(today+'fossil-fracture'),dailyNo=seed%997+1;
  function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
  function localDateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function readSave(){try{return Object.assign({best:0,bestStreak:0,runs:0,daily:{},cabinetRank:'—'},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {best:0,bestStreak:0,runs:0,daily:{},cabinetRank:'—'}}}
  function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}}
  function fresh(){return {mode:'title',stage:1,score:0,preservation:100,exposure:0,strikes:configs[0].strikes,streak:0,bestRunStreak:0,selectedTools:[],clampReady:false,removed:0,damaged:0,reveal:false,particles:0,stress:0,lastFracture:{removed:0,damage:0,branches:0,length:0}}}
  function reset(play=false){state=fresh();trail=[];dust=[];cracks=[];buildGrid();setMode(play?'play':'title');updateUI();draw()}
  function buildGrid(){const fossil=new Set(masks[state.stage-1].map(([x,y])=>x+','+y));grid=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const fault=((x*11+y*7+seed+state.stage*13)%29)<state.stage-1;grid.push({x,y,fossil:fossil.has(x+','+y),fault,removed:false,hit:0})}calculateExposure()}
  function setMode(mode){state.mode=mode;els.title.classList.toggle('hidden',mode!=='title');els.draft.classList.toggle('hidden',mode!=='draft');els.result.classList.toggle('hidden',mode!=='result');if(mode==='play')els.tip.textContent='암반 위를 드래그하고 놓아 균열을 전파하세요.'}
  function start(){unlockAudio();reset(true);tone(170,.05);showToast('지층 1 · 응력선을 그으세요')}
  function cellAt(px,py){const x=Math.floor(px/CW),y=Math.floor((py-TOP)/CH);return x<0||x>=COLS||y<0||y>=ROWS?null:grid[y*COLS+x]}
  function center(c){return {x:(c.x+.5)*CW,y:TOP+(c.y+.5)*CH}}
  function begin(x,y){if(state.mode!=='play')return;drawing=true;trail=[{x,y}];state.stress=0;updateStress()}
  function move(x,y){if(!drawing||state.mode!=='play')return;const prev=trail[trail.length-1];if(Math.hypot(x-prev.x,y-prev.y)>4){trail.push({x,y});state.stress=Math.min(100,pathLength(trail)/2.25+curvature(trail)*12);updateStress();draw()}}
  function end(x,y){if(!drawing||state.mode!=='play')return;if(trail.length===1)trail.push({x:x+2,y:y+2});else trail.push({x,y});drawing=false;fracture(trail);trail=[];state.stress=0;updateStress()}
  function pathLength(points){let n=0;for(let i=1;i<points.length;i++)n+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);return n}
  function curvature(points){let v=0;for(let i=2;i<points.length;i++){const a=Math.atan2(points[i-1].y-points[i-2].y,points[i-1].x-points[i-2].x),b=Math.atan2(points[i].y-points[i-1].y,points[i].x-points[i-1].x);v+=Math.abs(Math.atan2(Math.sin(b-a),Math.cos(b-a)))}return v}
  function distanceToPath(p,points){let best=1e9;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1))),x=a.x+t*dx,y=a.y+t*dy;best=Math.min(best,Math.hypot(p.x-x,p.y-y))}return best}
  function modifier(){let m={radius:0,safe:1,damage:1};for(const id of state.selectedTools){m.radius+=tools[id].radius;m.safe*=tools[id].safe;m.damage*=tools[id].damage}return m}
  function fracture(points){if(state.strikes<=0||state.mode!=='play')return;const cfg=configs[state.stage-1],mod=modifier(),len=pathLength(points),curve=curvature(points),radius=Math.max(6,9+Math.min(13,len/30)+curve*2+mod.radius*7),affected=[],fossils=[];state.strikes--;
    for(const c of grid){if(c.removed)continue;const d=distanceToPath(center(c),points);const branchBoost=c.fault?cfg.branches*1.7:0;if(d<=radius+branchBoost)(c.fossil?fossils:affected).push(c)}
    let removed=0;for(const c of affected){const needed=Math.max(1,Math.ceil(cfg.strength/2)-(c.fault?1:0));c.hit++;if(c.hit>=needed){c.removed=true;removed++;const p=center(c);spawnDust(p.x,p.y,c.fault?5:3)}}
    let damage=0;if(fossils.length){if(state.clampReady){state.clampReady=false;showToast('석고 클램프가 손상을 막았습니다')}else{damage=Math.max(4,Math.round((fossils.length*2+radius/7)*mod.damage));state.preservation=Math.max(0,state.preservation-damage);state.streak=0;state.damaged+=fossils.length;tone(85,.12);$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),230)}}else if(removed){state.streak++;state.bestRunStreak=Math.max(state.bestRunStreak,state.streak);showToast(state.streak>1?'무손상 연쇄 ×'+state.streak:'무손상 균열!')}
    const branchCount=Math.min(cfg.branches,Math.max(1,Math.floor(len/58)+Math.floor(curve)));for(let i=0;i<branchCount;i++){const p=points[Math.min(points.length-1,Math.floor((i+1)*points.length/(branchCount+1)))];cracks.push({x:p.x,y:p.y,a:(seed+i*1.7+state.stage)%6.28,life:1})}
    state.removed+=removed;state.score+=Math.round(removed*18*mod.safe+Math.max(0,12-damage)*state.streak);state.lastFracture={removed,damage,branches:branchCount,length:Math.round(len)};calculateExposure();tone(damage?90:220+removed*4,.06);updateUI();draw();
    if(state.preservation<=0)return finish(false,'화석 보존도 소진');
    if(state.exposure>=cfg.target)return completeStage();
    if(state.strikes<=0)return finish(false,'타격 수 소진');
  }
  function fossilRing(){return grid.filter(c=>!c.fossil&&grid.some(f=>f.fossil&&Math.abs(f.x-c.x)<=1&&Math.abs(f.y-c.y)<=1))}
  function calculateExposure(){const ring=fossilRing(),opened=ring.filter(c=>c.removed).length;state.exposure=ring.length?Math.round(opened/ring.length*100):0}
  function completeStage(){state.score+=state.strikes*90+state.preservation*2;state.reveal=true;for(const f of grid.filter(c=>c.fossil)){const p=center(f);spawnDust(p.x,p.y,7)}showToast('Museum Reveal · 지층 완성!');tone(520,.18);if(state.stage>=5)return setTimeout(()=>finish(true,'5개 지층 완전 발굴'),180);const done=state.stage;state.stage++;state.strikes=configs[state.stage-1].strikes;state.exposure=0;state.reveal=false;buildGrid();updateUI();draw();if(done===2||done===4)setTimeout(()=>setMode('draft'),120)}
  function chooseTool(id){if(state.mode!=='draft'||!tools[id])return;state.selectedTools.push(id);if(id==='clamp')state.clampReady=true;setMode('play');showToast(tools[id].label+' 장착');updateUI();draw();tone(390,.08)}
  function finish(success,reason){if(state.mode==='result')return;state.mode='result';state.reveal=true;state.particles=dust.length;const grade=success?(state.preservation>=92?'S':state.preservation>=75?'A':'B'):(state.stage>=4?'B':'C');save.runs++;save.best=Math.max(save.best,state.score);save.bestStreak=Math.max(save.bestStreak,state.bestRunStreak);save.daily[today]=Math.max(save.daily[today]||0,state.score);save.cabinetRank=grade;writeSave();els.resultTitle.textContent=success?'박물관 표본 완성':'발굴 기록 보존';els.grade.textContent=grade;els.resultCopy.textContent=reason+' · 점수 '+state.score.toLocaleString()+' · 무손상 연쇄 '+state.bestRunStreak;els.build.textContent='도구: '+(state.selectedTools.length?state.selectedTools.map(id=>tools[id].label).join(' + '):'기본 장비');els.card.classList.remove('reveal');void els.card.offsetWidth;els.card.classList.add('reveal');setMode('result');updateUI();draw();tone(success?660:120,.2)}
  function updateStress(){els.stress.style.width=state.stress+'%';els.stressText.textContent=Math.round(state.stress)+'%'}
  function updateUI(){const cfg=configs[state.stage-1];els.stage.textContent=state.stage+' / 5';els.exposure.textContent=state.exposure+'% / '+cfg.target+'%';els.preservation.textContent=String(state.preservation);els.strikes.textContent=String(state.strikes);els.daily.textContent='Daily Stratum #'+String(dailyNo).padStart(3,'0');els.best.textContent=save.best.toLocaleString();els.bestStreak.textContent=String(save.bestStreak)}
  function showToast(text){els.toast.textContent=text;els.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>els.toast.classList.remove('show'),900)}
  function spawnDust(x,y,n){for(let i=0;i<n&&dust.length<320;i++)dust.push({x,y,vx:Math.sin(i*2.4+seed)*(.4+i*.08),vy:-.4-Math.cos(i+seed)*.35,life:1,size:2+(i%3)})}
  function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#d4a76d');bg.addColorStop(1,'#8f5638');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.16;ctx.strokeStyle='#f7dfad';for(let y=26;y<H;y+=39){ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=W;x+=24)ctx.lineTo(x,y+Math.sin(x*.04+y)*5);ctx.stroke()}ctx.globalAlpha=1;
    for(const c of grid){const x=c.x*CW,y=TOP+c.y*CH;if(c.removed)continue;if(c.fossil){ctx.fillStyle=state.reveal?'#fff8d9':'#f5e4b7';roundRect(x+2,y+2,CW-4,CH-4,8);ctx.fill();ctx.strokeStyle='#c49d5a';ctx.lineWidth=2;ctx.stroke()}else{const shade=(c.x*17+c.y*31+seed)%18;ctx.fillStyle=c.fault?'#94503f':'rgb('+(177+shade)+','+(122+shade*.6)+','+(76+shade*.35)+')';roundRect(x+1,y+1,CW-2,CH-2,5);ctx.fill();ctx.strokeStyle='#70463266';ctx.lineWidth=1;ctx.stroke();if(c.hit){ctx.strokeStyle='#e5c18b';ctx.beginPath();ctx.moveTo(x+5,y+5);ctx.lineTo(x+CW-5,y+CH-5);ctx.stroke()}}}
    ctx.strokeStyle='#59392c';ctx.lineWidth=2;for(const c of grid.filter(x=>x.removed)){const p=center(c);ctx.beginPath();ctx.moveTo(p.x-8,p.y-5);ctx.lineTo(p.x,p.y);ctx.lineTo(p.x+7,p.y-8);ctx.stroke()}
    for(const c of cracks){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.strokeStyle='#4b3028';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,3);ctx.lineTo(27,-4);ctx.stroke();ctx.restore()}
    if(trail.length){ctx.strokeStyle=state.stress>74?'#d95842':'#51a69a';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#fff2c5';ctx.shadowBlur=8;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.shadowBlur=0}
    for(const p of dust){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#f2d59f';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
    ctx.fillStyle='#3d3328cc';ctx.font='800 11px ui-rounded,system-ui';ctx.fillText(configs[state.stage-1].name+' · 강도 '+configs[state.stage-1].strength+' · 단층 '+configs[state.stage-1].branches,12,H-12)
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
  function loop(t){const dt=Math.min(33,t-lastTime||16);lastTime=t;let active=false;for(const p of dust){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.025*dt/16;p.life-=.018*dt/16;if(p.life>0)active=true}dust=dust.filter(p=>p.life>0);if(active)draw();raf=requestAnimationFrame(loop)}
  function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e);canvas.setPointerCapture?.(e.pointerId);begin(p.x,p.y);e.preventDefault()});canvas.addEventListener('pointermove',e=>{const p=canvasPoint(e);move(p.x,p.y);e.preventDefault()});canvas.addEventListener('pointerup',e=>{const p=canvasPoint(e);end(p.x,p.y);e.preventDefault()});canvas.addEventListener('pointercancel',e=>{drawing=false;trail=[];state.stress=0;updateStress();e.preventDefault()});
  function unlockAudio(){if(!audio)try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch{audio=null}}
  function tone(freq,duration){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}
  $('startBtn').addEventListener('click',start);$('retryBtn').addEventListener('click',()=>reset(true));$('titleBtn').addEventListener('click',()=>reset(false));for(const b of document.querySelectorAll('.tool'))b.addEventListener('click',()=>chooseTool(b.dataset.tool));
  function snapshot(){const cfg=configs[state.stage-1],m=modifier();return {mode:state.mode,stage:state.stage,score:state.score,preservation:state.preservation,exposure:state.exposure,strikes:state.strikes,streak:state.streak,bestRunStreak:state.bestRunStreak,tools:[...state.selectedTools],clampReady:state.clampReady,removed:state.removed,damaged:state.damaged,reveal:state.reveal,particles:dust.length,lastFracture:{...state.lastFracture},config:{strength:cfg.strength,branches:cfg.branches,target:cfg.target},modifier:{radius:m.radius,safe:m.safe,damage:m.damage},dailyNo,seed}}
  function qaPath(kind){const fossils=grid.filter(c=>c.fossil),ring=fossilRing().filter(c=>!c.removed);if(kind==='hit'){const p=center(fossils[Math.floor(fossils.length/2)]);return [{x:p.x-5,y:p.y-4},{x:p.x+6,y:p.y+5}]}const target=ring[0]||grid.find(c=>!c.fossil&&!c.removed),p=center(target);return [{x:p.x-6,y:p.y},{x:p.x+7,y:p.y}]}
  function qaFracture(points){const before=snapshot();begin(points[0].x,points[0].y);for(const p of points.slice(1,-1))move(p.x,p.y);const last=points[points.length-1];end(last.x,last.y);return {before,after:snapshot()}}
  function qaForceStageComplete(){if(state.mode!=='play')return snapshot();for(const c of fossilRing())c.removed=true;calculateExposure();updateUI();completeStage();return snapshot()}
  window.render_game_to_text=()=>JSON.stringify(snapshot());
  window.__GAME_QA__={
    state:snapshot,start,fracture:qaFracture,path:qaPath,forceStageComplete:qaForceStageComplete,choose:chooseTool,
    fail:()=>finish(false,'QA gameover'),succeed:()=>{state.stage=5;finish(true,'QA complete')},retry:()=>reset(true),toTitle:()=>reset(false),
    storage:()=>JSON.parse(localStorage.getItem(KEY)||'{}'),configs:()=>configs.map(x=>({...x})),
    wowFactors:{stressLine:true,faultlineEscalation:true,conservatorDraft:true,museumReveal:true,dailyCabinet:true}
  };
  reset(false);document.body.dataset.qaReady='1';raf=requestAnimationFrame(loop);
})();
</script>
