<!doctype html>
<html lang="ko">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1322" />
  <title>고스트 픽셀 - Ghost Pixel</title>
<meta name="description" content="숨은 유령을 포획하는 추리 퍼즐. 스캔으로 단서를 얻고, 유령이 도망가기 전에 잡아라. 24레벨의 결정론적 미스터리. 무료 브라우저 플레이.">
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 15% -5%,#1a1a3a 0%,#0a0a1a 58%);color:#eaf8ff;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
    .wrap{width:min(100vw,560px);padding:8px;display:flex;flex-direction:column;gap:6px}
    .hud{display:flex;justify-content:space-between;align-items:center;padding:4px 8px}
    .hud h1{font-size:15px;font-weight:800;margin:0;color:#2fe5ff}
    .hud .meta{font-size:11px;opacity:.7}
    .arena{position:relative;background:#0d0d22;border:1px solid #2d2d65;border-radius:12px;padding:6px;box-shadow:inset 0 0 24px #000}
    iframe{width:100%;aspect-ratio:1/1;border:none;border-radius:8px;display:block;background:#0a0a1a}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <h1>👻 고스트 픽셀</h1>
      <span class="meta">Ghost Pixel · 추리 퍼즐</span>
    </div>
    <div class="arena">
      <iframe src="./game.html" allow="autoplay; gamepad; fullscreen" loading="eager"></iframe>
    </div>
  </div>
  <script>
    // Godot web build를 iframe 안에서 로드
    (function(){
      var iframe = document.querySelector('iframe');
      // Godot index.html을 game.html로 리네임했으므로 직접 로드
    })();
  </script>
</body>
</html>
