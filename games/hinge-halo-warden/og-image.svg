<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Hinge Halo Warden</title>
  <desc id="d">Warm ivory background with three golden shutters orbiting a central halo core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f0de"/>
      <stop offset="55%" stop-color="#e6c792"/>
      <stop offset="100%" stop-color="#6b7e8e"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="100%" stop-color="#cc8455"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#fff6e4" stroke-width="26" opacity=".9"/>
  <circle cx="600" cy="315" r="84" fill="#fef9ef" stroke="#7a5c48" stroke-width="12"/>
  <circle cx="600" cy="315" r="46" fill="#8ea2b1"/>
  <circle cx="600" cy="315" r="30" fill="#f6d58e"/>
  <g filter="url(#blur)" opacity=".5">
    <circle cx="600" cy="315" r="220" fill="#f4d18a"/>
  </g>
  <g transform="translate(600 315)">
    <g transform="rotate(-90)">
      <path d="M 0 -188 A 188 188 0 0 1 82 -169 L 48 -102 A 112 112 0 0 0 0 -112 Z" fill="url(#sh)" stroke="#704b3f" stroke-width="7"/>
      <circle cx="0" cy="-112" r="12" fill="#704b3f"/>
    </g>
    <g transform="rotate(30)">
      <path d="M 0 -188 A 188 188 0 0 1 82 -169 L 48 -102 A 112 112 0 0 0 0 -112 Z" fill="url(#sh)" stroke="#704b3f" stroke-width="7"/>
      <circle cx="0" cy="-112" r="12" fill="#704b3f"/>
    </g>
    <g transform="rotate(150)">
      <path d="M 0 -188 A 188 188 0 0 1 82 -169 L 48 -102 A 112 112 0 0 0 0 -112 Z" fill="url(#sh)" stroke="#704b3f" stroke-width="7"/>
      <circle cx="0" cy="-112" r="12" fill="#704b3f"/>
    </g>
  </g>
  <text x="90" y="130" fill="#372720" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Hinge Halo Warden</text>
  <text x="92" y="188" fill="#56463d" font-family="'Noto Sans KR', sans-serif" font-size="28">세 개의 셔터를 젖혀 초승달 궤적으로 코어를 지키는 원형 액션 디펜스</text>
  <g fill="#3b4f61" opacity=".9">
    <circle cx="888" cy="190" r="13"/>
    <circle cx="950" cy="262" r="18"/>
    <circle cx="1005" cy="334" r="11"/>
    <circle cx="920" cy="396" r="16"/>
  </g>
