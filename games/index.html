<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Sea Games — 무료 HTML5 게임</title>
  <meta name="description" content="동해(eastsea) 인디 게임 컬렉션 — 퍼즐, 아케이드, 경영 게임을 브라우저에서 바로 플레이">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px; line-height: 1.6;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; letter-spacing: -0.5px; }
    .sub { color: #8b949e; margin-bottom: 40px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px; max-width: 760px; width: 100%;
    }
    a.card {
      display: block; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 20px; text-decoration: none; color: #e6edf3;
      transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: #58a6ff; transform: translateY(-2px); }
    .card .name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
    .card .desc { color: #8b949e; font-size: .88rem; }
    .badge {
      display: inline-block; font-size: .72rem; padding: 2px 8px; margin-left: 6px;
      border-radius: 999px; background: #1f6feb33; color: #79c0ff; vertical-align: middle;
    }
    nav { margin-top: 48px; color: #8b949e; font-size: .9rem; }
    nav a { color: #58a6ff; text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <h1>🎮 East Sea Games</h1>
  <p class="sub">브라우저에서 바로 플레이하는 무료 인디 게임 8종</p>
  <div class="grid">
    <a class="card" href="/games/mirror-garden/"><div class="name">Mirror Garden <span class="badge">퍼즐</span></div><div class="desc">미러 가든 — 거울 반사 퍼즐</div></a>
    <a class="card" href="/games/grid-stampede/"><div class="name">Grid Stampede <span class="badge">아케이드</span></div><div class="desc">그리드 스탬피드 — 순발력 아케이드</div></a>
    <a class="card" href="/games/woodkind-grove/"><div class="name">Woodkind Grove <span class="badge">경영</span></div><div class="desc">목재 숲 경영 시뮬레이션</div></a>
    <a class="card" href="/games/gravity-shift/"><div class="name">Gravity Shift <span class="badge">퍼즐</span></div><div class="desc">중력 전환 퍼즐 플랫포머</div></a>
    <a class="card" href="/games/clean-steward/"><div class="name">클린 스튜어드 <span class="badge">new</span></div><div class="desc">Clean Steward</div></a>
    <a class="card" href="/games/crown-quest/"><div class="name">크라운 퀘스트 <span class="badge">new</span></div><div class="desc">Crown Quest</div></a>
    <a class="card" href="/games/derby-sprint/"><div class="name">Derby Sprint <span class="badge">new</span></div><div class="desc">더비 스프린트</div></a>
    <a class="card" href="/games/odds-rush/"><div class="name">오즈 러시 <span class="badge">new</span></div><div class="desc">Odds Rush</div></a>
  </div>
  <nav><a href="/">🏠 홈</a><a href="/tools/">🧰 도구</a><a href="/hotdeal/">🔥 핫딜</a></nav>
<script src="/assets/analytics.js"></script>
</body>
</html>
