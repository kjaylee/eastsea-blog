  <rect x="0" y="560" width="1200" height="70" fill="#915842"/>
  <text x="88" y="174" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#2f2b29">Lantern Longball League</text>
  <text x="92" y="244" font-family="Arial, sans-serif" font-size="34" fill="#5a4d44">Swipe to launch. Hook mid-flight. Chase the firework homer.</text>
  <text x="92" y="302" font-family="Arial, sans-serif" font-size="30" fill="#694f3d">랜턴 링을 꿰고 옥상 불꽃 홈런을 완성하는 스포츠 아케이드</text>
