      <text x="34" y="128" fill="#2f2a25" font-size="24" font-family="system-ui, -apple-system, sans-serif">2. Appeal Clock Pressure</text>
      <text x="34" y="160" fill="#2f2a25" font-size="24" font-family="system-ui, -apple-system, sans-serif">3. Perfect Verdict Postcard</text>
