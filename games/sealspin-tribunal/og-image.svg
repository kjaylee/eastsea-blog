    <rect x="30" y="30" width="170" height="170" rx="22" fill="#df8458" fill-opacity=".15"/>
    <rect x="230" y="30" width="170" height="170" rx="22" fill="#537f86" fill-opacity=".15"/>
    <rect x="30" y="230" width="170" height="170" rx="22" fill="#537f86" fill-opacity=".15"/>
    <rect x="230" y="230" width="170" height="170" rx="22" fill="#df8458" fill-opacity=".15"/>
    <g stroke="#263f4f" stroke-width="18" stroke-linecap="round">
      <path d="M82 258h80v80"/>
      <path d="M148 112v80h80"/>
      <path d="M318 110v80h-80"/>
      <path d="M286 318h80v-80"/>
      <path d="M202 82v266"/>
      <path d="M82 202h266"/>
    </g>
    <g fill="#d8ab48" stroke="#916836" stroke-width="6">
      <path d="M118 202l12 26 28 4-20 19 5 28-25-14-25 14 5-28-20-19 28-4z"/>
      <path d="M318 202l12 26 28 4-20 19 5 28-25-14-25 14 5-28-20-19 28-4z"/>
      <path d="M218 312l12 26 28 4-20 19 5 28-25-14-25 14 5-28-20-19 28-4z"/>
    </g>
  </g>
  <g transform="translate(610 120)">
    <text x="0" y="0" fill="#263f4f" font-size="78" font-family="system-ui, -apple-system, sans-serif" font-weight="800">Sealspin Tribunal</text>
    <text x="0" y="74" fill="#6f5e51" font-size="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700">봉인 선회 재판소</text>
    <text x="0" y="166" fill="#2f2a25" font-size="34" font-family="system-ui, -apple-system, sans-serif" font-weight="700">사분면 2x2 봉인 블록을 비틀어</text>
    <text x="0" y="214" fill="#2f2a25" font-size="34" font-family="system-ui, -apple-system, sans-serif" font-weight="700">seal과 평결 게이트를 하나의 경로로 잇는 퍼즐</text>
    <g transform="translate(0 292)">
