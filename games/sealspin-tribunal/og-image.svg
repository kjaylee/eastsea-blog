<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sealspin Tribunal</title>
  <desc id="desc">사분면 2x2 봉인 블록을 회전시켜 경로를 짜는 퍼즐 게임.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="52%" stop-color="#ead9b9"/>
      <stop offset="100%" stop-color="#d6b184"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#f1e1c3" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(120 95)">
