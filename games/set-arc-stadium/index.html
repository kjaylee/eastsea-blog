<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f4e6d5;color:#2f241d;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
body{display:flex;justify-content:center;align-items:center;min-height:100vh}
#app{position:relative;width:min(100vw,460px);height:min(100vh,900px);height:calc(var(--tg-viewport-height,100vh));max-height:100vh;overflow:hidden;background:linear-gradient(180deg,#f7d7af 0%,#efb574 26%,#d77c59 56%,#5f708e 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
button{border:none;border-radius:18px;padding:14px 16px;font:inherit;font-weight:900;cursor:pointer}
button:active{transform:scale(.985)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;z-index:7}
.panel{width:min(100%,372px);padding:22px;border-radius:28px;background:rgba(255,248,239,.92);backdrop-filter:blur(12px);border:1px solid rgba(88,63,47,.1);box-shadow:0 24px 54px rgba(63,32,16,.22)}
.title{margin:0;font-size:34px;line-height:1.02;letter-spacing:-.04em;color:#3f2d24}
.subtitle{margin:10px 0 16px;font-size:14px;line-height:1.48;color:#655043}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.primary{background:linear-gradient(135deg,#d67247 0%,#efb25f 100%);color:#fff}
.secondary{background:#fff;color:#5a4438}
.tiny{padding:10px 12px;font-size:12px}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}
.statBox,.resultBox,.draftCard,.contract{background:rgba(255,251,246,.88);border:1px solid rgba(101,70,52,.08);border-radius:18px;padding:12px}
.statBox .label,.resultBox .label,.draftCard .label,.contract .label{display:block;font-size:11px;color:#8b6d5b}
.statBox .value,.resultBox .value{display:block;margin-top:4px;font-size:18px;font-weight:900;color:#433128}
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
#topBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hudCard{min-height:58px;padding:8px 10px;border-radius:16px;background:rgba(255,248,240,.84);border:1px solid rgba(92,63,48,.08);box-shadow:0 12px 26px rgba(63,33,20,.14)}
.hudCard .k{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a6b58}
.hudCard .v{display:block;margin-top:4px;font-size:17px;font-weight:900;color:#402d24}
#contracts{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px}
.contract{flex:1;min-height:86px;padding:10px 11px;background:rgba(255,249,243,.9)}
.contract strong{display:block;font-size:12px;color:#60483b}
.contract span{display:block;margin-top:6px;font-size:12px;line-height:1.38;color:#6e5748}
.contract.done{outline:2px solid rgba(103,192,145,.7)}
#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 138px);transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:999px;background:rgba(70,44,34,.88);color:#fff;text-align:center;font-size:12px;font-weight:900;letter-spacing:.04em;opacity:0;transition:opacity .18s ease;z-index:5}
#banner.show{opacity:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 118px);z-index:4;padding:8px 14px;border-radius:999px;background:rgba(255,249,241,.86);font-size:12px;color:#644f43;border:1px solid rgba(90,61,46,.08)}
#draftScreen.hidden,#gameover.hidden,#titleScreen.hidden,#hud.hidden,#banner.hidden,#hint.hidden,#qaReport.hidden{display:none!important}
#draftList{display:grid;gap:10px;margin-top:14px}
.draftCard{padding:14px;text-align:left;cursor:pointer}
.draftCard strong{display:block;font-size:15px;color:#433026}
.draftCard span{display:block;margin-top:6px;font-size:12px;line-height:1.42;color:#6a5548}
#resultTitle{margin:0 0 8px;font-size:30px;line-height:1.04;color:#402c24}
#sharePreview{margin-top:12px;padding:12px;border-radius:18px;background:#fffaf5;border:1px solid rgba(89,60,47,.08);white-space:pre-line;font-size:12px;line-height:1.45;color:#664f42}
#qaReport{position:absolute;left:0;right:0;bottom:0;max-height:38%;overflow:auto;white-space:pre-wrap;z-index:20;background:rgba(8,16,24,.92);color:#b9ffd1;font-size:11px;padding:10px}
@media (max-width:390px){
  #topBar{grid-template-columns:repeat(2,minmax(0,1fr))}
  #contracts{flex-direction:column}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 290px)}

}

  <canvas id="game"></canvas>

  <div id="hud" class="hidden">

      <div class="hudCard"><span class="k" data-i18n="score">Score</span><span class="v" id="scoreValue">0</span></div>
      <div class="hudCard"><span class="k" data-i18n="rally">Rally</span><span class="v" id="rallyValue">0</span></div>

      <div class="hudCard"><span class="k" data-i18n="rank">Rank</span><span class="v" id="rankValue">Rookie</span></div>
    </div>
    <div id="banner"></div>
    <div id="hint"></div>
    <div id="contracts">
      <div class="contract" id="contract0"><span class="label">Contract</span><strong></strong><span></span></div>

  <div id="titleScreen" class="overlay">

      <div class="statGrid">
        <div class="statBox"><span class="label" data-i18n="bestScore">Best Score</span><span class="value" id="bestScoreTitle">0</span></div>
        <div class="statBox"><span class="label" data-i18n="bestRally">Best Rally</span><span class="value" id="bestRallyTitle">0</span></div>
        <div class="statBox"><span class="label" data-i18n="bestRank">Best Rank</span><span class="value" id="bestRankTitle">Rookie</span></div>

        <button class="primary" id="startBtn"></button>
        <button class="secondary tiny" id="langBtn">KO</button>

    </div>
  </div>

  <div id="draftScreen" class="overlay hidden">
    <div class="panel">
      <h2 id="draftTitle" class="title" style="font-size:29px;margin-bottom:8px">Playbook Draft</h2>
      <p class="subtitle" id="draftSubtitle"></p>
      <div id="draftList"></div>

  </div>

  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <h2 id="resultTitle"></h2>
      <p class="subtitle" id="resultSubtitle"></p>
      <div class="statGrid">
        <div class="resultBox"><span class="label" data-i18n="score">Score</span><span class="value" id="finalScore">0</span></div>
        <div class="resultBox"><span class="label" data-i18n="bestScore">Best Score</span><span class="value" id="finalBest">0</span></div>
        <div class="resultBox"><span class="label" data-i18n="bestRally">Best Rally</span><span class="value" id="finalRally">0</span></div>
        <div class="resultBox"><span class="label" data-i18n="contractsDone">Contracts</span><span class="value" id="finalContracts">0 / 3</span></div>
      </div>
      <div class="row">
        <button class="primary" id="retryBtn"></button>
        <button class="secondary" id="homeBtn"></button>
      </div>
      <div id="sharePreview"></div>
    </div>
  </div>

  <pre id="qaReport" class="hidden"></pre>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'setArcStadium.v1';
  const AUTOTEST = new URLSearchParams(location.search).get('autotest') === '1';
  const pageErrors = [];
  window.addEventListener('error', (event) => pageErrors.push(String(event.message || 'error')));

  const text = {
    titleSubtitle: {
      ko: '세터 자리에서 한 번의 라인을 그려 공격 레인과 템포를 동시에 설계하세요. 블로커 이동을 읽고 스포트라이트 존을 찢는 순간이 하이라이트가 됩니다.',
      en: 'Draw one set line from the setter spot to design both lane and tempo. Read the shifting blockers and pierce the spotlight zone.'
    },
    how: {
      ko: '세터 원 안에서 위로 드래그해 세트 아크를 그리세요. 높이는 템포, 좌우는 공격 레인입니다. 3득점마다 Playbook Draft가 열립니다.',
      en: 'Drag upward from the setter ring to draw a set arc. Height controls tempo, side controls lane. Every 3 scores opens a Playbook Draft.'
    },
    start: { ko: '랠리 시작', en: 'Start Rally' },
    retry: { ko: '다시 랠리', en: 'Run Again' },
    home: { ko: '타이틀로', en: 'Back to Title' },
    score: { ko: '점수', en: 'Score' },
    rally: { ko: '랠리', en: 'Rally' },
    lives: { ko: '라이프', en: 'Lives' },
    rank: { ko: '칭호', en: 'Rank' },
    bestScore: { ko: '최고 점수', en: 'Best Score' },
    bestRally: { ko: '최고 랠리', en: 'Best Rally' },
    bestRank: { ko: '최고 칭호', en: 'Best Rank' },
    runs: { ko: '플레이 수', en: 'Runs' },
    hint: { ko: '세터 원 안에서 위로 드래그', en: 'Drag upward from the setter ring' },
    draftSubtitle: { ko: '이번 런의 공격 문법을 한 장 바꾸세요.', en: 'Choose one playbook to change this run.' },
    resultTitle: { ko: '매치 종료', en: 'Match Over' },
    resultSubtitle: { ko: '이번 런의 하이라이트와 계약 결과입니다.', en: 'Your highlight line and contract progress for this run.' },
    contractsDone: { ko: '계약', en: 'Contracts' },
    perfect: { ko: 'Perfect Arc', en: 'Perfect Arc' },
    spotlight: { ko: 'Spotlight Kill', en: 'Spotlight Kill' },
    longRally: { ko: 'Long Rally', en: 'Long Rally' },
    contractPerfect: { ko: '완벽한 세트 4회', en: 'Hit 4 perfect sets' },
    contractSpotlight: { ko: '스포트라이트 3회', en: 'Land 3 spotlight kills' },
    contractRally: { ko: '랠리 7 도달', en: 'Reach rally 7' },
    bannerPerfect: { ko: 'PERFECT ARC', en: 'PERFECT ARC' },
    bannerSpotlight: { ko: 'SPOTLIGHT KILL', en: 'SPOTLIGHT KILL' },
    bannerFreeze: { ko: 'BROADCAST FREEZE', en: 'BROADCAST FREEZE' },
    bannerBlocked: { ko: 'SHIFT BLOCK', en: 'SHIFT BLOCK' },
    bannerDraft: { ko: 'PLAYBOOK OPEN', en: 'PLAYBOOK OPEN' },
    bannerStreak: { ko: 'RALLY SURGE', en: 'RALLY SURGE' },
    shareTemplate: {
      ko: 'Set Arc Stadium\n점수 {score}\n최고 랠리 {rally}\n칭호 {rank}\n계약 {done}/3\nhttps://eastsea-blog.pages.dev/games/set-arc-stadium/',
      en: 'Set Arc Stadium\nScore {score}\nBest Rally {rally}\nRank {rank}\nContracts {done}/3\nhttps://eastsea-blog.pages.dev/games/set-arc-stadium/'
    }
  };

  const ranks = [
    { score: 0, ko: '루키 세터', en: 'Rookie Setter' },
    { score: 400, ko: '라인 리더', en: 'Line Reader' },
    { score: 850, ko: '아크 메이커', en: 'Arc Maker' },
    { score: 1400, ko: '나이트 콘덕터', en: 'Night Conductor' }
  ];

  const upgradePool = [
    {
      id: 'quickTempo',
      title: { ko: '퀵 템포', en: 'Quick Tempo' },
      desc: { ko: '낮은 세트 성공 시 +45점, 샷 속도 증가', en: 'Low tempo hits gain +45 score and faster release.' }
    },
    {
      id: 'lateFloat',
      title: { ko: '레이트 플로트', en: 'Late Float' },
      desc: { ko: '하이 아크가 블록 한 칸을 넘길 수 있음', en: 'High arcs can clear one blocked lane.' }
    },
    {
      id: 'crowdSurge',
      title: { ko: '크라우드 서지', en: 'Crowd Surge' },
      desc: { ko: '랠리 2부터 연속 보너스 상승', en: 'Rally bonus starts at streak 2.' }
    },
    {
      id: 'spotlightWide',
      title: { ko: '와이드 스포트라이트', en: 'Wide Spotlight' },
      desc: { ko: '스포트라이트 존 폭 증가', en: 'The spotlight lane gets wider.' }
    },
    {
      id: 'blockRead',
      title: { ko: '블록 리드', en: 'Block Read' },
      desc: { ko: '막힌 레인 판정이 조금 느슨해짐', en: 'Blocked-lane reads become more forgiving.' }
    }
  ];

  const app = document.getElementById('app');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const banner = document.getElementById('banner');
  const hint = document.getElementById('hint');
  const titleScreen = document.getElementById('titleScreen');
  const draftScreen = document.getElementById('draftScreen');
  const gameover = document.getElementById('gameover');
  const qaReport = document.getElementById('qaReport');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const homeBtn = document.getElementById('homeBtn');
  const langBtn = document.getElementById('langBtn');
  const draftList = document.getElementById('draftList');
  const scoreValue = document.getElementById('scoreValue');
  const rallyValue = document.getElementById('rallyValue');
  const livesValue = document.getElementById('livesValue');
  const rankValue = document.getElementById('rankValue');
  const bestScoreTitle = document.getElementById('bestScoreTitle');
  const bestRallyTitle = document.getElementById('bestRallyTitle');
  const bestRankTitle = document.getElementById('bestRankTitle');
  const runsTitle = document.getElementById('runsTitle');
  const titleSubtitle = document.getElementById('titleSubtitle');
  const howText = document.getElementById('howText');
  const draftSubtitle = document.getElementById('draftSubtitle');
  const resultTitle = document.getElementById('resultTitle');
  const resultSubtitle = document.getElementById('resultSubtitle');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const finalRally = document.getElementById('finalRally');
  const finalContracts = document.getElementById('finalContracts');
  const sharePreview = document.getElementById('sharePreview');
  const contractEls = [0, 1, 2].map((i) => document.getElementById(`contract${i}`));

  let width = 390;
  let height = 844;
  let dpr = 1;
  let lastTime = 0;

  const save = loadSave();
  const state = {
    screen: 'title',
    score: 0,
    rally: 0,
    bestRunRally: 0,
    lives: 3,
    successes: 0,
    stage: 1,
    lang: save.lang,
    aiming: null,
    pointerId: null,
    shot: null,
    blockers: [],
    spotlightLane: 1,
    spotlightTimer: 0,
    bannerTimer: 0,
    bannerText: '',
    freezeTimer: 0,
    particles: [],
    perfectHits: 0,
    spotlightHits: 0,
    contractsDone: 0,
    draftChoices: [],
    upgrades: { quickTempo: 0, lateFloat: 0, crowdSurge: 0, spotlightWide: 0, blockRead: 0 },
    lastUpgradeId: '',
    lastLane: 'center',
    shareText: '',
    pageErrors,
  };

  function loadSave() {
    try {
      return Object.assign({ bestScore: 0, bestRally: 0, bestRank: '루키 세터', bestRankEn: 'Rookie Setter', runs: 0, lang: 'ko' }, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));
    } catch {
      return { bestScore: 0, bestRally: 0, bestRank: '루키 세터', bestRankEn: 'Rookie Setter', runs: 0, lang: 'ko' };
    }
  }

  function persistSave() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
  }

  function t(key) {
    const entry = text[key];
    if (!entry) return key;
    return entry[state.lang] || key;
  }

  function currentRank(score = state.score) {
    let pick = ranks[0];
    for (const rank of ranks) if (score >= rank.score) pick = rank;
    return state.lang === 'ko' ? pick.ko : pick.en;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = app.clientWidth;
    height = app.clientHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function court() {
    return {
      setterX: width * 0.5,
      setterY: height * 0.76,
      setterR: width * 0.085,
      netY: height * 0.49,
      attackMinX: width * 0.13,
      attackMaxX: width * 0.87,
      attackMinY: height * 0.18,
      attackMaxY: height * 0.4,
      laneWidth: width * 0.24
    };
  }

  function laneCenters() {
    const c = court();
    return [c.setterX - c.laneWidth, c.setterX, c.setterX + c.laneWidth];
  }

  function laneName(index) {
    return ['left', 'center', 'right'][index] || 'center';
  }

  function laneIndexFromX(x) {
    if (x < width * 0.34) return 0;
    if (x > width * 0.66) return 2;
    return 1;
  }

  function tempoFromY(y) {
    if (y > height * 0.33) return 'quick';
    if (y > height * 0.25) return 'mid';
    return 'high';
  }

  function startGame() {
    state.screen = 'play';
    state.score = 0;
    state.rally = 0;
    state.bestRunRally = 0;
    state.lives = 3;
    state.successes = 0;
    state.stage = 1;
    state.aiming = null;
    state.pointerId = null;
    state.shot = null;
    state.blockers = [];
    state.spotlightLane = 1;
    state.spotlightTimer = 0;
    state.bannerTimer = 0;
    state.freezeTimer = 0;
    state.particles = [];
    state.perfectHits = 0;
    state.spotlightHits = 0;
    state.contractsDone = 0;
    state.draftChoices = [];
    state.upgrades = { quickTempo: 0, lateFloat: 0, crowdSurge: 0, spotlightWide: 0, blockRead: 0 };
    state.lastUpgradeId = '';
    state.lastLane = 'center';
    state.shareText = '';
    save.runs += 1;
    persistSave();
    buildBlockers();
    showBanner(t('hint'), 1.6);
    updateUI();
  }

  function buildBlockers() {
    const count = state.stage >= 3 ? 2 : 1;
    state.blockers = [];
    for (let i = 0; i < count; i += 1) {
      state.blockers.push({
        baseLane: (state.successes + i) % 3,
        phase: Math.random() * Math.PI * 2,
        amplitude: 18 + state.stage * 4,
        width: 42 + state.stage * 6
      });
    }
  }

  function updateUI() {
    scoreValue.textContent = String(state.score);
    rallyValue.textContent = String(state.rally);
    livesValue.textContent = String(state.lives);
    rankValue.textContent = currentRank();
    bestScoreTitle.textContent = String(save.bestScore);
    bestRallyTitle.textContent = String(save.bestRally);
    bestRankTitle.textContent = state.lang === 'ko' ? save.bestRank : save.bestRankEn;
    runsTitle.textContent = String(save.runs);
    titleSubtitle.textContent = t('titleSubtitle');
    howText.textContent = t('how');
    hint.textContent = t('hint');
    draftSubtitle.textContent = t('draftSubtitle');
    resultTitle.textContent = t('resultTitle');
    resultSubtitle.textContent = t('resultSubtitle');
    startBtn.textContent = t('start');
    retryBtn.textContent = t('retry');
    homeBtn.textContent = t('home');
    langBtn.textContent = state.lang.toUpperCase();
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    updateContracts();
  }

  function updateContracts() {
    const items = [
      { title: t('perfect'), desc: t('contractPerfect'), done: state.perfectHits >= 4 },
      { title: t('spotlight'), desc: t('contractSpotlight'), done: state.spotlightHits >= 3 },
      { title: t('longRally'), desc: t('contractRally'), done: state.bestRunRally >= 7 }
    ];
    state.contractsDone = items.filter((item) => item.done).length;
    items.forEach((item, index) => {
      const el = contractEls[index];
      el.classList.toggle('done', item.done);
      el.querySelector('strong').textContent = item.title;
      el.querySelector('span:last-child').textContent = item.desc;
    });
  }

  function showBanner(message, duration = 1.1) {
    state.bannerText = message;
    state.bannerTimer = duration;
    banner.textContent = message;
    banner.classList.add('show');
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function spawnParticles(x, y, color, amount) {
    for (let i = 0; i < amount; i += 1) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.7) * 4,
        life: 0.7 + Math.random() * 0.6,
        radius: 2 + Math.random() * 4,
        color
      });
    }
  }

  function updateParticles(dt) {
    state.particles = state.particles.filter((particle) => {
      particle.life -= dt;
      particle.x += particle.vx * 60 * dt;
      particle.y += particle.vy * 60 * dt;
      particle.vy += 0.08;
      return particle.life > 0;
    });
  }

  function updateBlocks(dt) {
    const centers = laneCenters();
    state.spotlightTimer += dt * (0.7 + state.stage * 0.08);
    state.spotlightLane = Math.floor(state.spotlightTimer) % 3;
    state.blockers.forEach((blocker, index) => {
      blocker.phase += dt * (1.4 + state.stage * 0.16 + index * 0.15);
      blocker.x = centers[blocker.baseLane] + Math.sin(blocker.phase) * blocker.amplitude;
      blocker.y = court().netY - 22 - Math.abs(Math.sin(blocker.phase * 1.4)) * (18 + state.stage * 2);
    });
  }

  function makeAim(pointerX, pointerY) {
    const c = court();
    const tx = clamp(pointerX, c.attackMinX, c.attackMaxX);
    const ty = clamp(pointerY, c.attackMinY, c.attackMaxY);
    const tempo = tempoFromY(ty);
    const lane = laneIndexFromX(tx);
    const controlY = tempo === 'quick' ? height * 0.29 : tempo === 'mid' ? height * 0.23 : height * 0.17;
    return {
      start: { x: c.setterX, y: c.setterY },
      control: { x: (c.setterX + tx) * 0.5, y: controlY },
      end: { x: tx, y: ty },
      lane,
      tempo
    };
  }

  function pointOnCurve(curve, t) {
    const mt = 1 - t;
    return {
      x: mt * mt * curve.start.x + 2 * mt * t * curve.control.x + t * t * curve.end.x,
      y: mt * mt * curve.start.y + 2 * mt * t * curve.control.y + t * t * curve.end.y
    };
  }

  function pointerFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function tryBeginAim(event) {
    if (state.screen !== 'play' || state.shot || draftScreen.classList.contains('hidden') === false) return;
    const c = court();
    const point = pointerFromEvent(event);
    const dx = point.x - c.setterX;
    const dy = point.y - c.setterY;
    if ((dx * dx + dy * dy) > c.setterR * c.setterR * 1.4 || point.y > c.setterY + 12) return;
    state.pointerId = event.pointerId;
    state.aiming = makeAim(point.x, point.y);
    canvas.setPointerCapture(event.pointerId);
  }

  function updateAim(event) {
    if (state.pointerId !== event.pointerId || !state.aiming) return;
    const point = pointerFromEvent(event);
    state.aiming = makeAim(point.x, point.y);
  }

  function releaseAim(event) {
    if (state.pointerId !== event.pointerId || !state.aiming) return;
    state.pointerId = null;
    const shot = {
      curve: state.aiming,
      time: 0,
      duration: state.aiming.tempo === 'quick' ? 0.42 : state.aiming.tempo === 'mid' ? 0.54 : 0.7,
      resolved: false
    };
    if (state.upgrades.quickTempo) shot.duration *= 0.9;
    state.shot = shot;
    state.aiming = null;
  }

  function resolveShot(curve, overrides = {}) {
    const blockedLanes = state.blockers.map((blocker) => {
      const centers = laneCenters();
      let best = 0;
      let bestDist = Infinity;
      centers.forEach((center, index) => {
        const dist = Math.abs(center - blocker.x);
        if (dist < bestDist) { bestDist = dist; best = index; }
      });
      return best;
    });
    const lane = overrides.lane ?? curve.lane;
    const tempo = overrides.tempo ?? curve.tempo;
    const spotlight = overrides.spotlight ?? lane === state.spotlightLane;
    const perfect = overrides.perfect ?? (Math.abs(curve.end.x - laneCenters()[lane]) < width * 0.055 && tempo !== 'high');
    const canFloat = tempo === 'high' && state.upgrades.lateFloat > 0;
    const blockForgive = state.upgrades.blockRead > 0 && perfect;
    const blocked = overrides.blocked ?? (blockedLanes.includes(lane) && !canFloat && !blockForgive);
    const out = overrides.out ?? (curve.end.y > height * 0.385 && tempo === 'quick' && !perfect);
    const success = overrides.success ?? (!blocked && !out);
    return { lane, tempo, spotlight, perfect, blocked, out, success };
  }

  function finishShot(outcome) {
    if (outcome.success) {
      state.successes += 1;
      state.rally += 1;
      state.bestRunRally = Math.max(state.bestRunRally, state.rally);
      state.score += 90 + state.rally * 14 + (outcome.spotlight ? 70 : 0) + (outcome.perfect ? 40 : 0);
      if (outcome.tempo === 'quick' && state.upgrades.quickTempo) state.score += 45;
      if (state.upgrades.crowdSurge && state.rally >= 2) state.score += 18;
      if (outcome.perfect) {
        state.perfectHits += 1;
        showBanner(t('bannerPerfect'));
        spawnParticles(width * (0.3 + outcome.lane * 0.2), height * 0.28, '#ffe197', 14);
      }
      if (outcome.spotlight) {
        state.spotlightHits += 1;
        showBanner(t('bannerSpotlight'));
        spawnParticles(width * (0.3 + outcome.lane * 0.2), height * 0.26, '#b7f4ff', 18);
      }
      if (outcome.spotlight && outcome.perfect && outcome.lane !== laneIndexFromX(width * 0.5)) {
        state.freezeTimer = 0.16;
        showBanner(t('bannerFreeze'), 1.25);
      } else if (state.rally >= (state.upgrades.crowdSurge ? 2 : 3)) {
        showBanner(t('bannerStreak'));
      }
      state.lastLane = laneName(outcome.lane);
      state.stage = 1 + Math.floor(state.successes / 3);
      if (state.successes % 3 === 0) {
        openDraft();
      } else {
        buildBlockers();
      }
    } else {
      state.lives -= 1;
      state.rally = 0;
      showBanner(t('bannerBlocked'));
      spawnParticles(width * 0.5, height * 0.42, '#ff8b7a', 16);
      if (state.lives <= 0) {
        endGame();
        return;
      }
    }
    updateContracts();
    updateUI();
  }

  function openDraft() {
    state.screen = 'draft';
    draftScreen.classList.remove('hidden');
    const available = [...upgradePool].sort(() => Math.random() - 0.5).slice(0, 3);
    state.draftChoices = available;
    draftList.innerHTML = '';
    available.forEach((upgrade) => {
      const button = document.createElement('button');
      button.className = 'draftCard';
      button.innerHTML = `<span class="label">Playbook</span><strong>${upgrade.title[state.lang]}</strong><span>${upgrade.desc[state.lang]}</span>`;
      button.addEventListener('click', () => chooseDraft(upgrade.id));
      draftList.appendChild(button);
    });
    showBanner(t('bannerDraft'), 1.25);
  }

  function chooseDraft(id) {
    state.upgrades[id] += 1;
    state.lastUpgradeId = id;
    state.screen = 'play';
    draftScreen.classList.add('hidden');
    buildBlockers();
    updateUI();
  }

  function endGame() {
    state.screen = 'gameover';
    draftScreen.classList.add('hidden');
    gameover.classList.remove('hidden');
    const rankKo = ranks.findLast ? (ranks.findLast((rank) => state.score >= rank.score) || ranks[0]).ko : currentRank();
    const rankEn = (ranks.filter((rank) => state.score >= rank.score).pop() || ranks[0]).en;
    save.bestScore = Math.max(save.bestScore, state.score);
    save.bestRally = Math.max(save.bestRally, state.bestRunRally);
    if (state.score >= ranks[ranks.length - 1].score) {
      save.bestRank = ranks[ranks.length - 1].ko;
      save.bestRankEn = ranks[ranks.length - 1].en;
    } else if (state.score >= 1400) {
      save.bestRank = rankKo;
      save.bestRankEn = rankEn;
    } else if (state.score >= 850) {
      save.bestRank = rankKo;
      save.bestRankEn = rankEn;
    } else if (state.score >= 400) {
      save.bestRank = rankKo;
      save.bestRankEn = rankEn;
    }
    persistSave();
    finalScore.textContent = String(state.score);
    finalBest.textContent = String(save.bestScore);
    finalRally.textContent = String(state.bestRunRally);
    finalContracts.textContent = `${state.contractsDone} / 3`;
    state.shareText = t('shareTemplate')
      .replace('{score}', state.score)
      .replace('{rally}', state.bestRunRally)
      .replace('{rank}', currentRank())
      .replace('{done}', state.contractsDone);
    sharePreview.textContent = state.shareText;
    updateUI();
  }

  function resetToTitle() {
    state.screen = 'title';
    titleScreen.classList.remove('hidden');
    gameover.classList.add('hidden');
    draftScreen.classList.add('hidden');
    hud.classList.add('hidden');
    updateUI();
  }

  function toggleLang() {
    state.lang = state.lang === 'ko' ? 'en' : 'ko';
    save.lang = state.lang;
    persistSave();
    updateUI();
  }

  function updateShot(dt) {
    if (!state.shot) return;
    state.shot.time += dt / Math.max(0.01, state.shot.duration);
    if (state.shot.time >= 1 && !state.shot.resolved) {
      state.shot.resolved = true;
      const outcome = resolveShot(state.shot.curve);
      finishShot(outcome);
      state.shot = null;
    }
  }

  function update(dt) {
    if (state.freezeTimer > 0) {
      state.freezeTimer = Math.max(0, state.freezeTimer - dt);
      dt *= 0.25;
    }
    if (state.bannerTimer > 0) {
      state.bannerTimer -= dt;
      if (state.bannerTimer <= 0) banner.classList.remove('show');
    }
    updateParticles(dt);
    if (state.screen === 'play') {
      updateBlocks(dt);
      updateShot(dt);
    }
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, '#f8d7af');
    sky.addColorStop(0.28, '#efb56f');
    sky.addColorStop(0.58, '#d77c59');
    sky.addColorStop(1, '#5d6f8f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = 'rgba(255,246,237,.24)';
    for (let i = 0; i < 5; i += 1) {
      const x = width * (0.08 + i * 0.2);
      const w = width * 0.1;
      const h = height * (0.18 + (i % 3) * 0.06);
      ctx.fillRect(x, height * 0.18 - h, w, h);
    }

    ctx.fillStyle = '#d1b998';
    ctx.fillRect(0, height * 0.82, width, height * 0.18);
  }

  function drawCourt() {
    const c = court();
    ctx.fillStyle = '#f8efe2';
    ctx.fillRect(width * 0.08, height * 0.17, width * 0.84, height * 0.6);
    ctx.fillStyle = '#e4c69b';
    ctx.fillRect(width * 0.08, c.netY, width * 0.84, 3);
    ctx.strokeStyle = 'rgba(113,83,66,.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(width * 0.08, height * 0.17, width * 0.84, height * 0.6);
    ctx.beginPath();
    ctx.moveTo(width * 0.5, height * 0.17);
    ctx.lineTo(width * 0.5, c.netY);
    ctx.stroke();

    const centers = laneCenters();
    const spotlightWidth = (state.upgrades.spotlightWide ? 0.24 : 0.18) * width;
    ctx.fillStyle = 'rgba(188, 237, 255, 0.28)';
    drawRoundedRect(centers[state.spotlightLane] - spotlightWidth * 0.5, height * 0.2, spotlightWidth, height * 0.18, 14);
    ctx.fill();

    ctx.fillStyle = '#8e5a43';
    drawRoundedRect(c.setterX - c.setterR, c.setterY - c.setterR * 0.65, c.setterR * 2, c.setterR * 1.3, 26);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.setterX, c.setterY, c.setterR, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawBlocks() {
    state.blockers.forEach((blocker, index) => {
      const hue = index === 0 ? '#4f678a' : '#35516e';
      ctx.fillStyle = hue;
      drawRoundedRect(blocker.x - blocker.width * 0.5, blocker.y - 18, blocker.width, 36, 14);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(blocker.x - blocker.width * 0.26, blocker.y - 10, blocker.width * 0.52, 6);
    });
  }

  function drawAim() {
    if (!state.aiming) return;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(state.aiming.start.x, state.aiming.start.y);
    ctx.quadraticCurveTo(state.aiming.control.x, state.aiming.control.y, state.aiming.end.x, state.aiming.end.y);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(state.aiming.end.x, state.aiming.end.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShot() {
    if (!state.shot) return;
    const point = pointOnCurve(state.shot.curve, Math.min(state.shot.time, 1));
    ctx.strokeStyle = 'rgba(255,246,203,.56)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(state.shot.curve.start.x, state.shot.curve.start.y);
    ctx.quadraticCurveTo(state.shot.curve.control.x, state.shot.curve.control.y, point.x, point.y);
    ctx.stroke();
    ctx.fillStyle = '#fff4cf';
    ctx.beginPath();
    ctx.arc(point.x, point.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(227,149,102,.66)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawParticles() {
    state.particles.forEach((particle) => {
      ctx.globalAlpha = Math.max(0, particle.life);
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    drawBackground();
    drawCourt();
    drawBlocks();
    drawAim();
    drawShot();
    drawParticles();
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = Math.min(0.033, (timestamp - lastTime) / 1000);
    lastTime = timestamp;
    update(delta);
    draw();
    requestAnimationFrame(loop);
  }

  async function runAutotest() {
    qaReport.classList.remove('hidden');
    hud.classList.remove('hidden');
    const checks = [];
    const check = (name, pass, detail = '') => checks.push(`${pass ? 'PASS' : 'FAIL'} ${name}${detail ? ` :: ${detail}` : ''}`);
    try {
      startGame();
      titleScreen.classList.add('hidden');
      gameover.classList.add('hidden');
      hud.classList.remove('hidden');
      check('start', state.screen === 'play');
      finishShot(resolveShot(makeAim(width * 0.25, height * 0.24), { success: true, spotlight: true, perfect: true, lane: 0, tempo: 'mid' }));
      finishShot(resolveShot(makeAim(width * 0.74, height * 0.34), { success: true, spotlight: false, perfect: false, lane: 2, tempo: 'quick' }));
      finishShot(resolveShot(makeAim(width * 0.5, height * 0.22), { success: true, spotlight: true, perfect: true, lane: 1, tempo: 'high' }));
      check('score', state.score > 0 && state.screen === 'draft');
      chooseDraft(state.draftChoices[0].id);
      check('draft', state.screen === 'play' && state.upgrades[state.lastUpgradeId] > 0, state.lastUpgradeId);
      finishShot(resolveShot(makeAim(width * 0.72, height * 0.28), { success: true, spotlight: true, perfect: true, lane: 2, tempo: 'quick' }));
      finishShot(resolveShot(makeAim(width * 0.5, height * 0.35), { success: false, blocked: true, lane: 1, tempo: 'quick' }));
      finishShot(resolveShot(makeAim(width * 0.5, height * 0.35), { success: false, blocked: true, lane: 1, tempo: 'quick' }));
      state.lives = 1;
      finishShot(resolveShot(makeAim(width * 0.5, height * 0.35), { success: false, blocked: true, lane: 1, tempo: 'quick' }));
      check('gameover', state.screen === 'gameover');
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      check('save', (stored.bestScore || 0) >= state.score);
      check('viewport', document.documentElement.scrollWidth <= window.innerWidth + 1);
      check('pageerror', pageErrors.length === 0, pageErrors.join('; '));
    } catch (error) {
      check('exception', false, String(error));
    }
    qaReport.textContent = checks.join('\n');
    window.__autotestResults = checks;
  }

  startBtn.addEventListener('click', () => {
    titleScreen.classList.add('hidden');
    gameover.classList.add('hidden');
    hud.classList.remove('hidden');
    startGame();
  });
  retryBtn.addEventListener('click', () => {
    gameover.classList.add('hidden');
    titleScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    startGame();
  });
  homeBtn.addEventListener('click', resetToTitle);
  langBtn.addEventListener('click', toggleLang);

  canvas.addEventListener('pointerdown', (event) => { event.preventDefault(); tryBeginAim(event); }, { passive: false });
  canvas.addEventListener('pointermove', (event) => { if (state.pointerId === event.pointerId) { event.preventDefault(); updateAim(event); } }, { passive: false });
  canvas.addEventListener('pointerup', (event) => { if (state.pointerId === event.pointerId) { event.preventDefault(); releaseAim(event); } }, { passive: false });
  canvas.addEventListener('pointercancel', (event) => { if (state.pointerId === event.pointerId) { state.pointerId = null; state.aiming = null; } }, { passive: false });

  resize();
  window.addEventListener('resize', resize);
  updateUI();
  if (AUTOTEST) {
    titleScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    runAutotest();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
