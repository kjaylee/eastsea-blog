<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ead3a5">
  <title>Waxline Verdict — 왁스라인 평결</title>
  <meta name="description" content="한 번의 붉은 왁스선으로 필수 증거만 봉인하는 모바일 폐곡선 퍼즐.">
  <link rel="canonical" href="https://eastsea-blog.pages.dev/games/waxline-verdict/">
  <style>
    :root{--paper:#f6e8c9;--paper2:#e6c98f;--ink:#30271f;--muted:#78654e;--vermilion:#aa3f2f;--gold:#c89535;--sage:#61745c;--bad:#664137}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ccb07d;color:var(--ink);font-family:Georgia,"Noto Serif KR",serif;touch-action:none}
    body{display:grid;place-items:center}
    #app{position:relative;width:min(100vw,430px);height:100dvh;max-height:100vh;overflow:hidden;background:var(--paper);box-shadow:0 0 60px rgba(52,35,20,.3)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:rgba(67,43,26,.24);backdrop-filter:blur(2px)}
    .panel{width:min(100%,360px);padding:23px;border:1px solid rgba(74,45,25,.18);border-radius:6px;background:rgba(249,237,210,.97);box-shadow:0 22px 50px rgba(65,40,24,.25);text-align:center}
    .eyebrow{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--vermilion)}
    h1,h2{margin:8px 0 0;line-height:1.04;letter-spacing:-.035em}h1{font-size:36px}h2{font-size:29px}
    p{margin:12px 0 0;font:500 14px/1.55 system-ui,"Noto Sans KR",sans-serif;color:#67533d}
    .rule{height:1px;margin:17px 0;background:linear-gradient(90deg,transparent,#9c794f,transparent)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
    .stat{padding:10px 5px;background:#f0ddb6;border:1px solid rgba(82,51,28,.1)}
    .stat span{display:block;font:700 10px/1.2 system-ui,sans-serif;color:#80684e}.stat strong{display:block;margin-top:4px;font-size:18px}
    button{width:100%;border:0;border-radius:3px;padding:14px 12px;background:linear-gradient(135deg,#9f3428,#bd5940);color:#fff8e8;font:800 14px/1.2 system-ui,"Noto Sans KR",sans-serif;letter-spacing:.02em;box-shadow:0 8px 18px rgba(137,48,36,.24);cursor:pointer}
    button:active{transform:translateY(1px)}button:disabled{opacity:.46;box-shadow:none}
    .choices{display:grid;gap:9px;margin-top:17px}.choice{text-align:left;background:#f4e2bd;color:var(--ink);box-shadow:none;border:1px solid rgba(86,54,29,.14)}
    .choice strong,.choice small{display:block}.choice small{margin-top:5px;color:#725e47;font-weight:600;line-height:1.35}
    .hidden{display:none!important}
    #actionBar{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 17px);display:grid;grid-template-columns:1fr 1.55fr;gap:9px}
    #actionBar button{min-height:48px}#clearBtn{background:#ead5ab;color:#553f2c;box-shadow:0 6px 16px rgba(74,50,29,.14);border:1px solid rgba(83,53,29,.15)}
    #qaBadge{position:absolute;left:8px;bottom:8px;max-width:374px;padding:6px 8px;background:#f8e9c6;border:1px solid #a96a3d;color:#4a3827;font:700 10px/1.35 ui-monospace,monospace;white-space:pre-wrap;pointer-events:none}
    @media(max-height:690px){.panel{padding:16px}.panel h1{font-size:31px}.panel p{font-size:12px}.stats{margin:10px 0}}
  </style>
</head>
<body>
<main id="app">
  <canvas id="game" width="390" height="844" aria-label="왁스라인 평결 게임 보드"></canvas>
  <section class="overlay" id="titleScreen">
    <div class="panel">
      <div class="eyebrow">Royal Clerk · Daily Docket</div>
      <h1>Waxline<br>Verdict</h1>
      <p>손가락을 떼지 않고 한 번에 봉인선을 그으세요.<br>황금 증거는 안에, 먹빛 오염은 밖에.</p>
      <div class="rule"></div>
      <div class="stats">
        <div class="stat"><span>최고점</span><strong id="bestScore">0</strong></div>
        <div class="stat"><span>최고 등급</span><strong id="bestGrade">—</strong></div>
        <div class="stat"><span>심리 횟수</span><strong id="runCount">0</strong></div>
      </div>
      <button id="startBtn">오늘의 사건부 열기</button>
      <p>한 획 · 5개 사건 · 전체화면 F</p>
    </div>
  </section>
  <section class="overlay hidden" id="oathScreen">
    <div class="panel">
      <div class="eyebrow">Clerk's Oath</div>
      <h2>서기관의 맹세</h2>
      <p>남은 사건에 적용할 조항 하나를 서명하세요.</p>
      <div class="choices" id="oathChoices"></div>
    </div>
  </section>
  <section class="overlay hidden" id="resultScreen">
    <div class="panel">
      <div class="eyebrow">Docket Closed</div>
      <h2 id="resultGrade">A · 왕실 서기관</h2>
      <p id="resultSummary"></p>
      <div class="stats">
        <div class="stat"><span>점수</span><strong id="finalScore">0</strong></div>
        <div class="stat"><span>성공</span><strong id="finalWins">0/5</strong></div>
        <div class="stat"><span>남은 잉크</span><strong id="finalInk">0</strong></div>
      </div>
      <button id="restartBtn">새 사건부 준비</button>
    </div>
  </section>
  <div id="actionBar" class="hidden">
    <button id="clearBtn">선 지우기</button>
    <button id="continueBtn" disabled>왕실 도장 확인 중…</button>
  </div>
  <pre id="qaBadge" class="hidden"></pre>
</main>
<script>
(() => {
  'use strict';
  const W=390,H=844,BOARD={x:24,y:174,w:342,h:518},KEY='waxline-verdict-ledger-v1';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const titleScreen=document.getElementById('titleScreen'),oathScreen=document.getElementById('oathScreen'),resultScreen=document.getElementById('resultScreen');
  const actionBar=document.getElementById('actionBar'),continueBtn=document.getElementById('continueBtn'),clearBtn=document.getElementById('clearBtn');
  const qaMode=new URLSearchParams(location.search).get('qa')==='1',pageErrors=[];
  window.__pageErrors=pageErrors;
  addEventListener('error',event=>pageErrors.push(String(event.error?.message||event.message||'page error')));
  addEventListener('unhandledrejection',event=>pageErrors.push(String(event.reason?.message||event.reason||'unhandled rejection')));
  let ledger=loadLedger(),rafLast=performance.now();
  const state={mode:'title',round:1,score:0,ink:3,wins:0,stroke:[],drawing:false,used:0,budget:720,closeRadius:26,verdict:null,message:'',caseData:null,time:0,sealTimer:0,upgrades:[],effects:{margin:1,cleanRecord:0,pardon:0},seed:dateSeed(),dailyKey:dailyKey()};

  function loadLedger(){try{return Object.assign({bestScore:0,bestGrade:'—',runs:0,daily:{}},JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(_){return{bestScore:0,bestGrade:'—',runs:0,daily:{}}}}
  function saveLedger(grade){ledger.runs++;ledger.bestScore=Math.max(ledger.bestScore,state.score);if(rankGrade(grade)>rankGrade(ledger.bestGrade))ledger.bestGrade=grade;ledger.daily[state.dailyKey]=Math.max(ledger.daily[state.dailyKey]||0,state.score);try{localStorage.setItem(KEY,JSON.stringify(ledger))}catch(error){pageErrors.push('ledger save: '+String(error?.message||error))}}
  function rankGrade(g){return({S:5,A:4,B:3,C:2,D:1,'—':0})[String(g).charAt(0)]||0}
  function dailyKey(){return new Date().toLocaleDateString('en-CA')}
  function dateSeed(){let h=2166136261;for(const c of dailyKey()+'waxline')h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
  function rngFor(round){let x=(state.seed+round*2654435761)>>>0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
  function nodeNow(n){const motion=state.round>=2?Math.min(10,state.round*1.7):0;return{x:n.x+Math.sin(state.time*.001*n.speed+n.phase)*motion,y:n.y+Math.cos(state.time*.00083*n.speed+n.phase)*motion*.68}}
  function makeCase(round){
    const rand=rngFor(round),goldCount=round<3?2:round<5?3:4,rawBad=round+1,badCount=Math.max(1,rawBad-state.effects.cleanRecord);
    const cx=195+(rand()-.5)*16,cy=423+(rand()-.5)*42,nodes=[],concave=round>=3;
    const addNode=(id,type,x,y,r)=>nodes.push({id,type,x,y,r,phase:rand()*6.28,speed:.65+rand()*.7});
    if(concave){
      const offsets=round===5?[[-65,-48],[65,-48],[-48,56],[48,56]]:[[-65,-48],[65,-48],[0,58]];
      offsets.forEach((p,i)=>addNode('G'+(i+1),'required',cx+p[0],cy+p[1],13));
    }else for(let i=0;i<goldCount;i++){const a=(Math.PI*2*i/goldCount)+(round%2?.35:-.2),rad=62;addNode('G'+(i+1),'required',cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*.72,13)}
    const ringCount=badCount-(concave?1:0);
    for(let i=0;i<badCount;i++){
      if(concave&&i===0){addNode('X1','contaminant',cx,cy-38,14);continue}
      const ringIndex=i-(concave?1:0),a=Math.PI*2*(ringIndex+.35)/Math.max(1,ringCount)+(round*.29),rad=150+(ringIndex%2)*10;
      addNode('X'+(i+1),'contaminant',cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*.88,14);
    }
    const base=980-round*25;state.budget=Math.round(base*state.effects.margin);return{title:['사라진 인장','공작의 이중 장부','오목한 증언','움직이는 알리바이','왕관의 마지막 서신'][round-1],nodes,cx,cy,concave};
  }
  function updateTitle(){document.getElementById('bestScore').textContent=ledger.bestScore;document.getElementById('bestGrade').textContent=ledger.bestGrade;document.getElementById('runCount').textContent=ledger.runs}
  function startGame(){Object.assign(state,{mode:'playing',round:1,score:0,ink:3,wins:0,stroke:[],drawing:false,used:0,verdict:null,message:'황금 증거만 한 획으로 봉인하세요.',time:0,sealTimer:0,upgrades:[],effects:{margin:1,cleanRecord:0,pardon:0}});state.caseData=makeCase(1);titleScreen.classList.add('hidden');resultScreen.classList.add('hidden');oathScreen.classList.add('hidden');actionBar.classList.remove('hidden');syncActions();render()}
  function resetStroke(){if(state.mode!=='playing')return;state.stroke=[];state.used=0;state.verdict=null;state.message='새 봉인선을 시작하세요.';syncActions();render()}
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
  function segmentsCross(a,b,c,d){const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);return o1*o2<0&&o3*o4<0}
  function hasSelfIntersection(points,closed){const n=points.length,limit=closed?n:n-1;for(let i=0;i<limit;i++){const a=points[i],b=points[(i+1)%n];for(let j=i+2;j<limit;j++){if(i===0&&j===limit-1)continue;const c=points[j],d=points[(j+1)%n];if(segmentsCross(a,b,c,d))return true}}return false}
  function pointInPolygon(p,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))inside=!inside}return inside}
  function strokeStatus(points=state.stroke){const closed=points.length>=9&&dist(points[0],points[points.length-1])<=state.closeRadius;const used=pathLength(points)+(closed?dist(points[points.length-1],points[0]):0);const crossing=points.length>=4&&hasSelfIntersection(points,closed);return{closed,used,crossing,valid:closed&&!crossing&&used<=state.budget,reason:!closed?'시작점으로 돌아와 폐곡선을 닫으세요.':crossing?'자기교차: 선이 서로 가로지를 수 없습니다.':used>state.budget?'왁스 길이 예산을 초과했습니다.':'제출 가능한 봉인선입니다.'}}
  function pathLength(points){let total=0;for(let i=1;i<points.length;i++)total+=dist(points[i-1],points[i]);return total}
  function addStrokePoint(p){if(!state.drawing||state.mode!=='playing')return;const last=state.stroke[state.stroke.length-1];if(last&&dist(last,p)<4)return;state.stroke.push({x:Math.max(BOARD.x,Math.min(BOARD.x+BOARD.w,p.x)),y:Math.max(BOARD.y,Math.min(BOARD.y+BOARD.h,p.y))});state.used=pathLength(state.stroke);render()}
  function evaluateStroke(points){const result=state.caseData.nodes.map(n=>{const p=nodeNow(n);return{id:n.id,type:n.type,inside:pointInPolygon(p,points)}});return{nodes:result,success:result.every(n=>n.type==='required'?n.inside:!n.inside)}}
  function completeStroke(points){state.stroke=points.map(p=>({x:p.x,y:p.y}));const status=strokeStatus();state.used=status.used;if(!status.valid){state.message=status.reason;state.verdict='invalid';syncActions();render();return false}
    const success=evaluateStroke(state.stroke).success;
    state.mode='feedback';state.verdict=success?'success':'fail';state.message=success?'증거가 분리되었습니다. 왕실 인장을 내립니다.':'증거 분류가 어긋났습니다. 잉크 한 병을 잃습니다.';state.sealTimer=0;
    if(success){state.wins++;const economy=Math.max(0,Math.round(state.budget-state.used));state.score+=240+state.round*110+economy}else if(state.effects.pardon>0){state.effects.pardon--;state.message='재심 조항이 잉크 손실을 막았습니다.'}else state.ink--;
    syncActions();render();return success;
  }
  function continueAfterVerdict(){if(state.mode!=='feedback'||state.sealTimer<650)return false;if(state.ink<=0){finishGame();return true}if(state.verdict==='fail'){beginRound();return true}if(state.round>=5){finishGame();return true}if(state.round===2||state.round===4){showOath();return true}state.round++;beginRound();return true}
  function beginRound(){state.mode='playing';state.stroke=[];state.used=0;state.verdict=null;state.message='증언이 움직입니다. 현재 위치를 봉인하세요.';state.caseData=makeCase(state.round);syncActions();render()}
  const OATHS=[
    {id:'margin',name:'넓은 왕실 여백',body:'남은 사건의 왁스 길이 예산 +22%.',apply:()=>state.effects.margin*=1.22},
    {id:'clean',name:'깨끗한 기록',body:'남은 모든 사건에서 오염 증거 1개 감소.',apply:()=>state.effects.cleanRecord++},
    {id:'pardon',name:'재심 조항',body:'다음 실패 1회를 잉크 손실 없이 무효화.',apply:()=>state.effects.pardon++}
  ];
  function showOath(){state.mode='oath';actionBar.classList.add('hidden');oathScreen.classList.remove('hidden');const list=document.getElementById('oathChoices');list.innerHTML='';OATHS.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<strong>'+(i+1)+'. '+o.name+'</strong><small>'+o.body+'</small>';b.addEventListener('click',()=>chooseOath(i));list.appendChild(b)});render()}
  function chooseOath(index){if(state.mode!=='oath'||!OATHS[index])return false;const oath=OATHS[index];oath.apply();state.upgrades.push(oath.id);oathScreen.classList.add('hidden');actionBar.classList.remove('hidden');state.round++;beginRound();return true}
  function gradeFor(){if(state.wins===5&&state.ink===3)return'S';if(state.wins>=4)return'A';if(state.wins>=3)return'B';if(state.wins>=2)return'C';return'D'}
  function finishGame(){state.mode='result';const grade=gradeFor();saveLedger(grade);actionBar.classList.add('hidden');resultScreen.classList.remove('hidden');document.getElementById('resultGrade').textContent=grade+' · '+({S:'대법관의 오른손',A:'왕실 서기관',B:'숙련 기록관',C:'견습 서기',D:'번진 깃펜'}[grade]);document.getElementById('resultSummary').textContent='오늘의 '+state.dailyKey+' 사건부가 봉인되었습니다. 일일 최고점 '+ledger.daily[state.dailyKey]+'점.';document.getElementById('finalScore').textContent=state.score;document.getElementById('finalWins').textContent=state.wins+'/5';document.getElementById('finalInk').textContent=state.ink;updateTitle();render()}
  function restart(){resultScreen.classList.add('hidden');titleScreen.classList.remove('hidden');state.mode='title';state.stroke=[];updateTitle();render()}
  function syncActions(){const feedback=state.mode==='feedback';clearBtn.disabled=feedback;continueBtn.disabled=!feedback||state.sealTimer<650;continueBtn.textContent=feedback?(state.sealTimer<650?'왕실 도장 확인 중…':(state.round>=5||state.ink<=0?'사건부 봉인':'다음 사건')):'봉인선을 그으세요'}
  function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  canvas.addEventListener('pointerdown',e=>{if(state.mode!=='playing'||!insideBoard(canvasPoint(e)))return;canvas.setPointerCapture(e.pointerId);state.drawing=true;state.stroke=[];state.verdict=null;addStrokePoint(canvasPoint(e))});
  canvas.addEventListener('pointermove',e=>{if(state.drawing)addStrokePoint(canvasPoint(e))});
  canvas.addEventListener('pointerup',e=>{if(!state.drawing)return;addStrokePoint(canvasPoint(e));state.drawing=false;completeStroke(state.stroke)});
  canvas.addEventListener('pointercancel',()=>{state.drawing=false});
  function insideBoard(p){return p.x>=BOARD.x&&p.x<=BOARD.x+BOARD.w&&p.y>=BOARD.y&&p.y<=BOARD.y+BOARD.h}
  document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('restartBtn').addEventListener('click',restart);clearBtn.addEventListener('click',resetStroke);continueBtn.addEventListener('click',continueAfterVerdict);
  addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}else if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});

  function parchment(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f7eacb');g.addColorStop(.55,'#efd8a9');g.addColorStop(1,'#dbbb7f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.12;ctx.fillStyle='#7c5935';for(let i=0;i<90;i++){const x=(i*83)%W,y=(i*149)%H;ctx.fillRect(x,y,1+(i%2),1)}ctx.globalAlpha=1;ctx.strokeStyle='rgba(106,72,39,.22)';ctx.strokeRect(12.5,12.5,W-25,H-25)}
  function text(t,x,y,size=14,align='left',color='#30271f',weight='700'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui,"Noto Sans KR",sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
  function drawHeader(){text('WAXLINE VERDICT',24,39,11,'left','#9d3b2c','800');text('왕실 사건부 · '+state.dailyKey,366,39,10,'right','#735d45','700');ctx.strokeStyle='rgba(106,69,37,.3)';ctx.beginPath();ctx.moveTo(24,56);ctx.lineTo(366,56);ctx.stroke();if(state.mode!=='title'){text('사건 '+state.round+' / 5',24,81,15);text('점수 '+state.score,366,81,15,'right');text('잉크 '+('●'.repeat(Math.max(0,state.ink))||'없음'),24,107,13,'left',state.ink?'#9d3b2c':'#684137');text('왁스 '+Math.round(state.used)+' / '+state.budget,366,107,13,'right');text(state.caseData?.title||'',195,140,22,'center','#3b2c20','800')}}
  function drawBoard(){ctx.fillStyle='rgba(255,249,230,.5)';ctx.fillRect(BOARD.x,BOARD.y,BOARD.w,BOARD.h);ctx.strokeStyle='rgba(93,61,32,.27)';ctx.lineWidth=1;ctx.strokeRect(BOARD.x+.5,BOARD.y+.5,BOARD.w-1,BOARD.h-1);for(let y=BOARD.y+52;y<BOARD.y+BOARD.h;y+=52){ctx.strokeStyle='rgba(120,88,49,.09)';ctx.beginPath();ctx.moveTo(BOARD.x,y);ctx.lineTo(BOARD.x+BOARD.w,y);ctx.stroke()}}
  function drawNode(n){const p=nodeNow(n);ctx.save();ctx.translate(p.x,p.y);if(n.type==='required'){ctx.fillStyle='rgba(198,146,47,.16)';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c89535';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1c6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.stroke();text(n.id,0,1,9,'center','#4d351e','900')}else{ctx.fillStyle='rgba(92,59,49,.15)';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#654138';ctx.rotate(.18+Math.sin(state.time*.001+n.phase)*.1);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?9:15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();text(n.id,0,1,8,'center','#f2dec0','900')}ctx.restore()}
  function drawStroke(){if(state.stroke.length<2)return;const s=strokeStatus(),color=s.crossing||s.used>state.budget?'#744038':s.closed?'#5e765c':'#a83c2d';ctx.strokeStyle=color;ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='rgba(94,38,29,.22)';ctx.shadowBlur=5;ctx.beginPath();ctx.moveTo(state.stroke[0].x,state.stroke[0].y);for(let i=1;i<state.stroke.length;i++)ctx.lineTo(state.stroke[i].x,state.stroke[i].y);if(s.closed)ctx.closePath();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=s.valid?'rgba(101,119,84,.08)':'rgba(168,60,45,.04)';if(s.closed)ctx.fill();ctx.strokeStyle=s.closed?'#5e765c':'#a83c2d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(state.stroke[0].x,state.stroke[0].y,state.closeRadius,0,Math.PI*2);ctx.stroke()}
  function drawMessage(){const y=718;let color='#68533d';if(state.verdict==='invalid'||state.verdict==='fail')color='#8f3e32';if(state.verdict==='success')color='#566f50';text(state.message||'한 획으로 증거를 분류하세요.',195,y,13,'center',color,'750');text(state.mode==='playing'?'선을 시작점으로 되돌리면 즉시 제출됩니다.':'',195,y+25,11,'center','#7b674f','600')}
  function drawSeal(){if(state.mode!=='feedback')return;ctx.fillStyle='rgba(69,41,24,.28)';ctx.fillRect(BOARD.x,BOARD.y,BOARD.w,BOARD.h);if(state.verdict==='success'){const t=Math.min(1,state.sealTimer/520),scale=.6+t*.55;ctx.save();ctx.translate(195,426);ctx.scale(scale,scale);ctx.rotate(-.09);ctx.fillStyle='#a53c2f';ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?68:75;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.strokeStyle='#f0cf91';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,52,0,Math.PI*2);ctx.stroke();text('ROYAL',0,-12,14,'center','#f6dfae','900');text('VERDICT',0,12,14,'center','#f6dfae','900');ctx.restore()}else{text('분류 기각',195,420,31,'center','#f0ddbd','900')}}
  function render(){parchment();drawHeader();if(state.mode!=='title'&&state.caseData){drawBoard();state.caseData.nodes.forEach(drawNode);drawStroke();drawSeal();drawMessage()}if(state.mode==='title'){text('☙',195,430,90,'center','#ad4935','400');text('한 획이 곧 판결입니다',195,518,16,'center','#725942','700')}}
  function tick(now){const dt=Math.min(40,now-rafLast);rafLast=now;if(state.mode!=='title'&&state.mode!=='result'){state.time+=dt;if(state.mode==='feedback'){state.sealTimer+=dt;syncActions()}render()}requestAnimationFrame(tick)}

  function renderText(){const status=strokeStatus();return JSON.stringify({coordinateSystem:'canvas 390x844; origin top-left; +x right; +y down; board x=24..366 y=174..692',mode:state.mode,dateSeed:state.seed,round:state.round,score:state.score,ink:state.ink,wins:state.wins,caseTitle:state.caseData?.title||null,nodes:(state.caseData?.nodes||[]).map(n=>Object.assign({id:n.id,type:n.type,r:n.r},nodeNow(n))),line:{points:state.stroke.map(p=>({x:Math.round(p.x),y:Math.round(p.y)})),used:Math.round(status.used),budget:state.budget,closed:status.closed,selfIntersecting:status.crossing,valid:status.valid,reason:status.reason},stateMessage:state.message,sealFreezeMsRemaining:Math.max(0,Math.round(650-state.sealTimer)),upgrades:[...state.upgrades],effects:{...state.effects},ledger:{bestScore:ledger.bestScore,bestGrade:ledger.bestGrade,runs:ledger.runs,dailyBest:ledger.daily[state.dailyKey]||0}})}
  window.render_game_to_text=renderText;
  window.advanceTime=ms=>{const steps=Math.max(1,Math.round(ms/(1000/60)));for(let i=0;i<steps;i++){state.time+=1000/60;if(state.mode==='feedback')state.sealTimer+=1000/60}syncActions();render()};
  function validContour(){if(state.caseData.concave){const{cx,cy}=state.caseData;return[{x:cx-88,y:cy-78},{x:cx-24,y:cy-78},{x:cx-24,y:cy+5},{x:cx+24,y:cy+5},{x:cx+24,y:cy-78},{x:cx+88,y:cy-78},{x:cx+88,y:cy+82},{x:cx-88,y:cy+82},{x:cx-88,y:cy-78}]}const gold=state.caseData.nodes.filter(n=>n.type==='required').map(nodeNow),cx=gold.reduce((a,p)=>a+p.x,0)/gold.length,cy=gold.reduce((a,p)=>a+p.y,0)/gold.length;let radius=Math.max(...gold.map(p=>dist(p,{x:cx,y:cy})))+32;const bad=state.caseData.nodes.filter(n=>n.type==='contaminant').map(nodeNow);const nearest=Math.min(...bad.map(p=>dist(p,{x:cx,y:cy})));radius=Math.min(radius,nearest-20);const pts=[];for(let i=0;i<=24;i++){const a=i*Math.PI*2/24;pts.push({x:cx+Math.cos(a)*radius,y:cy+Math.sin(a)*radius})}return pts}
  window.__waxlineTest={start:startGame,completeStroke,validContour,continue:continueAfterVerdict,chooseOath,restart,snapshot:()=>JSON.parse(renderText())};
  async function runQA(){const checks=[];const check=(name,ok)=>{checks.push({name,pass:!!ok});if(!ok)throw new Error(name)};try{check('title',state.mode==='title');startGame();check('start',state.mode==='playing'&&state.round===1);completeStroke(validContour());check('round1-valid',state.verdict==='success');window.advanceTime(700);continueAfterVerdict();const bow=[{x:105,y:310},{x:285,y:530},{x:285,y:310},{x:105,y:530},{x:105,y:310}];completeStroke(bow);check('self-cross-rejected',state.mode==='playing'&&state.verdict==='invalid'&&strokeStatus().crossing);completeStroke(validContour());check('round2-valid',state.mode==='feedback');window.advanceTime(700);continueAfterVerdict();check('oath-after-2',state.mode==='oath');chooseOath(0);check('oath-effect',state.effects.margin>1&&state.round===3);const circle=[];for(let i=0;i<=24;i++){const a=i*Math.PI*2/24;circle.push({x:state.caseData.cx+Math.cos(a)*95,y:state.caseData.cy+Math.sin(a)*95})}const inkBefore=state.ink;completeStroke(circle);check('round3-convex-rejected',state.verdict==='fail'&&state.ink===inkBefore-1);window.advanceTime(700);continueAfterVerdict();check('round3-retry-same-case',state.mode==='playing'&&state.round===3);for(const r of [3,4]){completeStroke(validContour());check('round'+r+'-valid',state.verdict==='success');window.advanceTime(700);continueAfterVerdict();if(r===4){check('oath-after-4',state.mode==='oath');chooseOath(1)}}completeStroke(validContour());check('round5-valid',state.verdict==='success');window.advanceTime(700);continueAfterVerdict();check('five-round-result',state.mode==='result'&&state.wins===5);check('saved',ledger.runs>0&&ledger.bestScore>=state.score);check('page-errors',pageErrors.length===0);restart();check('restart',state.mode==='title');window.__qaResult={pass:true,checks,errors:[]}}catch(err){window.__qaResult={pass:false,checks,errors:[String(err&&err.message||err),...pageErrors]}}const badge=document.getElementById('qaBadge');badge.classList.remove('hidden');badge.textContent=JSON.stringify(window.__qaResult,null,2)}
  updateTitle();render();requestAnimationFrame(tick);if(qaMode)setTimeout(runQA,40);
})();
